name: 스레드 성적표

# 어떤 글이 잘 됐는지 숫자로 본다.
# 목표가 "조회·댓글·좋아요를 늘리는 것"이면 늘리는 방법은 하나뿐이다 —
# 뭐가 잘 됐는지 알고 그쪽으로 글을 옮기는 것. 그러려면 숫자가 있어야 한다.
#
# 아무것도 올리지 않는다. 읽기만 한다.

on:
  schedule:
    # 매주 월요일 00:30 UTC (한국시간 월요일 오전 9시 30분)
    - cron: '30 0 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: '며칠치를 볼까요'
        type: string
        default: '14'

permissions:
  contents: read

concurrency:
  group: threads-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 성적 긁어오기
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DAYS: ${{ inputs.days }}
        run: node scripts/threads-report.mjs
