# 리포에 아무것도 쓰지 않는다. 읽기 권한이면 충분하다.
permissions:
  contents: read

concurrency:
  group: sports-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 633편의 본문을 쓰는 0원 모드(글끼리 링크·오타 고치기)는 30분을 넘긴다.
    # 실제로 547편까지 쓰고 잘렸다. 이어서 돌릴 수 있게 만들어 뒀지만, 한 번에
    # 끝나는 쪽이 낫다. AI 모드의 비용은 시간이 아니라 호출 수로 묶여 있으므로
    # 이 숫자를 올려도 돈이 더 들지는 않는다.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sports-news/package-lock.json

      # 텍스트 카드 이미지에 한글을 그리려면 한글 폰트가 있어야 한다.
      # 러너 기본 폰트로는 중국어체나 비트맵으로 그려져 썸네일 모양이 나쁘다.
      #
      # 글을 쓰는 방식일 때만 설치한다. apt로 2분쯤 걸리는데, 0원 방식(손보기·
      # 메타 설명 채우기 등)은 이미지를 만들지 않으므로 그 2분이 그냥 버려진다.
      # 메타 설명 채우기는 여러 번 나눠 돌리는 일이라 차이가 크다.
      # 조건은 아래 '실행' 단계와 똑같이 둔다 — 모르는 방식이 들어오면 설치하는
      # 쪽으로 기운다(안 깔려서 글씨가 깨지는 것보다 2분 버리는 게 낫다).
      #
      # 5분을 넘기면 포기한다. apt가 응답 없이 매달리는 일이 실제로 있었다
      # (취소 요청에도 안 죽고 8분 넘게 버텼다). 단계에 제한이 없으면 job의
      # 30분을 그대로 먹는다. 폰트는 AI를 부르기 전에 깔리므로 돈은 안 들지만
      # 30분을 버리고 글도 못 쓴다.
      #
      # 실패해도 계속 간다. 폰트가 없으면 카드 글씨 모양이 나빠질 뿐이고,
      # 글 자체는 그대로 나간다. 글을 못 쓰는 것보다 카드가 못생긴 게 낫다.
      # 조용히 넘기지는 않는다 — 아래 경고가 실행 기록에 남는다.
      - name: 한글 폰트 설치
        if: ${{ (!contains(inputs.mode, '사이트 조사만') && !contains(inputs.mode, 'SEO 손보기') && !contains(inputs.mode, '링크 현재창으로') && !contains(inputs.mode, '글 찾기') && !contains(inputs.mode, '메타 설명') && !contains(inputs.mode, '이미지 설명') && !contains(inputs.mode, '분류 설명') && !contains(inputs.mode, '상금 제목') && !contains(inputs.mode, '제목·설명 고치기') && !contains(inputs.mode, '중계 배너') && !contains(inputs.mode, '홈페이지 배너') && !contains(inputs.mode, '광고가 페이지에') && !contains(inputs.mode, '색인이 안 되는 이유') && !contains(inputs.mode, '겹치는 글 전부') && !contains(inputs.mode, '보강 1순위') && !contains(inputs.mode, '섞인 이름') && !contains(inputs.mode, '용접된 문단') && !contains(inputs.mode, 'alt 둘') && !contains(inputs.mode, '무엇이 모자란지') && !contains(inputs.mode, '같은 대회 짝') && !contains(inputs.mode, '안내 여러 쌍에') && !contains(inputs.mode, '글 본문 보기') && !contains(inputs.mode, '카드 이미지 다시 굽기') && !contains(inputs.mode, '색인에서 빼기') && !contains(inputs.mode, '다시 들여보내기') && !contains(inputs.mode, '시설 글 제목') && !contains(inputs.mode, '볼링 글 제목') && !contains(inputs.mode, 'AI 인용 기준') && !contains(inputs.mode, '흔들리는 말') && !contains(inputs.mode, '첫 문장 보기') && !contains(inputs.mode, '인사말로 연 글') && !contains(inputs.mode, '인사말 걷어내기') && !contains(inputs.mode, '첫 문장을 결론으로') && !contains(inputs.mode, '자주 묻는 질문 절 넣기') && !contains(inputs.mode, '글끼리 링크') && !contains(inputs.mode, '오타') && !contains(inputs.mode, '휴지통') && !contains(inputs.mode, '임시글 발행') && !contains(inputs.mode, '우리 미디어에 올리기') && !contains(inputs.mode, '깨진 링크') && !contains(inputs.mode, '깨진 표') && !contains(inputs.mode, '글자로 남은 링크') && !contains(inputs.mode, '누를 수 없는 주소') && !contains(inputs.mode, '적힌 주소를 링크로') && !contains(inputs.mode, '하단 고정 바') && !contains(inputs.mode, '본문 쿠팡 상품') && !contains(inputs.mode, '광고 아래 여백') && !contains(inputs.mode, '돌려주기') && !contains(inputs.mode, '사이트맵') && !contains(inputs.mode, '쿠팡 광고를') && !contains(inputs.mode, '소제목 섹션 빼기') && !contains(inputs.mode, '섹션 끼워넣기') && !contains(inputs.mode, '섹션 내용 갈아끼우기') && !contains(inputs.mode, '올해 글 안내') && !contains(inputs.mode, '글감 후보') && !contains(inputs.mode, '공식 페이지') && !contains(inputs.mode, '파일로 올리기')) || contains(inputs.mode, '파일로 올리기') || contains(inputs.mode, '카드 이미지 다시 굽기') }}
        timeout-minutes: 5
        continue-on-error: true
        run: |
          # **apt-get update 를 먼저 돌리지 않는다.**
          #
          # 2026-10-26 에 이 단계가 두 번 매달려 5분 타임아웃에 걸렸다.
          # 매달린 자리는 update 다 — 미러 몇 곳에 붙어 응답을 기다린다.
          # 러너 이미지는 패키지 목록을 이미 들고 있으므로 바로 install 을
          # 해 보고, 그게 "패키지를 못 찾겠다"로 실패할 때만 update 한다.
          #
          # fonts-nanum 을 먼저 고른다. 한글 전용이라 fonts-noto-cjk(수백 MB,
          # 중국어·일본어까지 들어 있다)보다 훨씬 작고 빨리 깔린다.
          install_font() {
            sudo apt-get install -y -qq --no-install-recommends "$1" 2>/dev/null
          }
          install_font fonts-nanum \
            || install_font fonts-noto-cjk \
            || { sudo apt-get update -qq && install_font fonts-nanum; } \
            || true

          # **깔렸는지 눈으로 확인한다.**
          #
          # 전에는 `|| echo` 로 끝냈다. 그러면 apt 가 실패하든 매달려 잘리든
          # 단계가 늘 성공으로 찍힌다. 2026-10-26 에 실제로 그렇게 됐고,
          # 폰트 없이 그려진 카드가 글 11265 에 두부(□)로 올라가 발행됐다.
          # 실행 기록만 보면 전부 초록이라 알아챌 수가 없었다.
          #
          # 그래서 fc-list 로 직접 묻고, 없으면 경고를 남긴다. 여기서 job 을
          # 죽이지는 않는다 — 카드가 없어도 글은 나가는 쪽이 낫고, 이제
          # textcard.mjs 가 한글 폰트가 없으면 카드를 아예 그리지 않는다.
          if fc-list :lang=ko family 2>/dev/null | grep -q .; then
            echo "한글 폰트 확인:"
            fc-list :lang=ko family 2>/dev/null | sort -u | head -5
          else
            echo "::warning::한글 폰트가 없습니다. 글은 그대로 나가지만 카드 이미지는 건너뜁니다 (두부 글자를 올리지 않습니다)."
          fi

      - name: 설치
        working-directory: sports-news
        run: npm ci

      - name: 자체 검사
        working-directory: sports-news
        run: npm test

      - name: 비밀값이 등록되어 있는지 확인
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: |
          missing=""
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$WORDPRESS_URL" ] && missing="$missing WORDPRESS_URL"
          [ -z "$WORDPRESS_USERNAME" ] && missing="$missing WORDPRESS_USERNAME"
          [ -z "$WORDPRESS_APP_PASSWORD" ] && missing="$missing WORDPRESS_APP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::등록되지 않은 비밀값:$missing"
            echo "리포 Settings → Secrets and variables → Actions → New repository secret 에서 추가하세요."
            exit 1
          fi
          echo "비밀값 4개 모두 등록되어 있습니다. (값은 출력하지 않습니다)"

      - name: 공식 페이지 받아보기
        # config/facilities.json 에 사람이 확인해 적어둔 공식 주소를 직접 받아온다.
        # AI를 한 번도 부르지 않으므로 0원이다.
        #
        # 왜 필요한가: 돈이 되는 글(시설 요금·예약)은 뉴스에 안 나와서 웹검색이
        # 유일한 출처였다. 그런데 웹검색은 계정 한도에 걸리면 한 건도 못 가져온다.
        # 글을 쓰기 전에 이걸 돌려 요금표가 실제로 읽히는지 먼저 본다 — 안 읽히면
        # 돈만 쓰고 글이 안 나온다.
        if: ${{ contains(inputs.mode, '공식 페이지') }}
        working-directory: sports-news
        env:
          # 비밀값을 넘기지 않는다. 이 모드는 AI도 워드프레스도 쓰지 않는다 —
          # 넘길 필요가 없는 것을 넘기지 않는 게 안전하다.
          IN_SUBJECT: ${{ inputs.subject }}
          IN_TOPIC: ${{ inputs.topic }}
        run: |
          # 변수명은 영문으로 둔다. bash 변수명에 한글을 쓰면 할당이 아니라
          # 명령으로 해석되어 'command not found' 로 죽는다(실제로 당했다).
          SUBJ="${IN_SUBJECT:-$IN_TOPIC}"
          if [ -z "$SUBJ" ]; then
            echo "::error::주제를 적어주세요 (subject). 예: 남서울CC 파3 이용료"
            exit 1
          fi
          node src/main.mjs --official --subject="$SUBJ" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 오늘의 글감 후보 보기
        # 뉴스를 모아 점수만 매겨 보여주고 멈춘다. AI를 한 번도 부르지 않으므로
        # 비용이 0원이다. 운영자가 보고 직접 고르는 용도다.
        if: ${{ contains(inputs.mode, '글감 후보') }}
        working-directory: sports-news
        env:
          IN_TOPIC: ${{ inputs.topic }}
          IN_COUNT: ${{ inputs.count }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          # 파이프 뒤에서도 node 의 실패를 잃지 않는다 (아래 tee 때문).
          set -o pipefail
          n=10
          case "$IN_COUNT" in
            ''|*[!0-9]*) ;;
            *) [ "$IN_COUNT" -gt 1 ] && n="$IN_COUNT" ;;
          esac
          if [ -n "$IN_TOPIC" ]; then
            node src/main.mjs "--candidates=$n" "--topic=$IN_TOPIC" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          else
            node src/main.mjs "--candidates=$n" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          fi

      - name: 사이트 조사 (카테고리·SEO 필드 확인, 글은 만들지 않음)
        # **이 단계가 실패해도 run 을 죽이지 않는다** (2026-11-09).
        #
        # 이 단계에는 `if` 가 없다 — 어떤 모드든 무조건 돈다. 그래서
        # 호스트(Imunify360)가 러너 IP 에 한 번 403 을 주면 **모드와
        # 무관하게 모든 run 이 거기서 끝났다.** run 979 가 그렇게 죽었다 —
        # '누를 수 없는 주소 세기' 는 워드프레스를 읽기만 하는 모드인데
        # 뒤 단계 전부가 skipped 로 넘어가고 아무 일도 하지 않았다.
        #
        # 죽일 이유가 없다. 이 단계가 만드는 것은 `config/site.json` 하나고,
        # 그 파일은 **커밋돼 있지 않으며** 읽는 쪽(`main.mjs`·`from-file.mjs`)이
        # 둘 다 없으면 `null` 로 넘어가게 이미 짜여 있다. 카테고리는 그때
        # API 로 다시 찾는다. 실패가 결과를 틀리게 만드는 자리가 아니다.
        #
        # ⚠️ 그래도 **조용히 넘기지 않는다.** 로그에 빨간 단계로 남으므로
        #    403 이 잦아지면 바로 보인다. 다음에 이 단계를 고칠 때
        #    `continue-on-error` 를 떼려면, 먼저 왜 모드마다 이 단계가
        #    돌아야 하는지를 적어라 — 지금은 그 이유가 없다.
        continue-on-error: true
        working-directory: sports-news
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: npm run wp:check

      - name: 이미 만든 글 SEO 손보기
        # 본문을 다시 만들지 않고 대표 키워드만 본문에 실제로 있는 말로 바꾼다.
        # AI를 부르지 않으므로 비용이 0원이다.
        if: ${{ contains(inputs.mode, 'SEO 손보기') }}
        working-directory: sports-news
        env:
          IN_POST_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: |
          if [ -z "$IN_POST_IDS" ]; then
            echo "::error::글 번호를 적어주세요 (예: 7246 7241)"
            exit 1
          fi
          ids=()
          for id in $IN_POST_IDS; do
            case "$id" in
              ''|*[!0-9]*) echo "::error::글 번호는 숫자여야 합니다: $id"; exit 1 ;;
              *) ids+=("$id") ;;
            esac
          done
          node src/wordpress/fix-seo.mjs "${ids[@]}" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 이미 올린 글 링크 현재창으로
        # 본문의 target="_blank"만 걷어낸다. 글의 상태(발행/임시글)는 건드리지 않는다.
        # AI를 부르지 않으므로 비용이 0원이다.
        if: ${{ contains(inputs.mode, '링크 현재창으로') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_COUNT: ${{ inputs.count }}
          IN_POST_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: |
          set -o pipefail
          # '모든 글' 모드는 글 번호가 필요 없다. 발행·임시글을 전부 훑는다.
          case "$IN_MODE" in
            *모든\ 글*)
              case "$IN_COUNT" in
                ''|*[!0-9]*) echo "::error::개수는 숫자여야 합니다: $IN_COUNT"; exit 1 ;;
              esac
              dry=''
              case "$IN_MODE" in *미리보기*) dry='--dry-run' ;; esac
              node src/wordpress/fix-links.mjs --all "--limit=$IN_COUNT" $dry 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
              exit 0
              ;;
          esac
          if [ -z "$IN_POST_IDS" ]; then
            echo "::error::글 번호를 적어주세요 (예: 7253). 전부 훑으려면 '모든 글 링크 현재창으로'를 고르세요."
            exit 1
          fi
          ids=()
          for id in $IN_POST_IDS; do
            case "$id" in
              ''|*[!0-9]*) echo "::error::글 번호는 숫자여야 합니다: $id"; exit 1 ;;
              *) ids+=("$id") ;;
            esac
          done
          node src/wordpress/fix-links.mjs "${ids[@]}" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 글에서 소제목 섹션 빼기
        # 소제목 하나와 그 아래 내용을 통째로 뺀다. 본문만 보내고,
        # 뺀 섹션 말고 다른 것이 바뀌면 저장하지 않는다. 원본은 파일로 남는다.
        if: ${{ contains(inputs.mode, '소제목 섹션 빼기') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_POST_IDS: ${{ inputs.post_ids }}
          IN_HEADING: ${{ inputs.new_title }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_POST_IDS" ]; then
            echo "::error::글 번호를 적어주세요 (post_ids)"; exit 1
          fi
          apply=""
          case "$IN_MODE" in *"실제 적용"*) apply="--apply" ;; esac
          # 소제목은 new_title 칸으로 받는다. 비우면 '안 쓴 것' 이다.
          args=""
          if [ -n "$IN_HEADING" ]; then args="--heading=$IN_HEADING"; fi
          node src/wordpress/drop-section.mjs $IN_POST_IDS $apply ${args:+"$args"} 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 글에 섹션 끼워넣기 · 섹션 내용 갈아끼우기
        # 이미 색인된 글 하나를 계속 갱신하기 위한 단계다. 대회가 진행되는
        # 동안 결과가 하루에 한 번씩 나오는데, 그때마다 새 글을 쓰면 대회가
        # 끝나는 순간 그 글들이 다 죽는다 — 중계 유형 357편이 그렇게 죽었다.
        #
        # 칸 쓰는 법 (입력 칸이 이미 15개라 새로 만들지 않고 나눠 쓴다):
        #   post_ids  : 글 번호
        #   file_path : 넣을 내용이 담긴 파일 (빈 줄로 문단을 나눈다)
        #   new_title : 끼워넣기 — 어느 소제목 **뒤에** 넣을지 (기준 소제목)
        #               갈아끼우기 — 내용을 바꿀 소제목
        #   new_desc  : 끼워넣기 — 새로 만들 소제목 (갈아끼우기에서는 비운다)
        if: ${{ contains(inputs.mode, '섹션 끼워넣기') || contains(inputs.mode, '섹션 내용 갈아끼우기') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_POST_IDS: ${{ inputs.post_ids }}
          IN_FILE: ${{ inputs.file_path }}
          IN_ANCHOR: ${{ inputs.new_title }}
          IN_NEW_HEADING: ${{ inputs.new_desc }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_POST_IDS" ]; then
            echo "::error::글 번호를 적어주세요 (post_ids)"; exit 1
          fi
          if [ -z "$IN_FILE" ]; then
            echo "::error::넣을 내용이 담긴 파일 경로를 적어주세요 (file_path)"; exit 1
          fi
          if [ -z "$IN_ANCHOR" ]; then
            echo "::error::소제목을 적어주세요 (new_title). 끼워넣기면 기준 소제목, 갈아끼우기면 바꿀 소제목입니다"; exit 1
          fi
          target="$IN_FILE"
          if [ ! -f "$target" ] && [ -f "../$IN_FILE" ]; then
            target="../$IN_FILE"
          fi
          if [ ! -f "$target" ]; then
            echo "::error::파일을 찾을 수 없습니다: $IN_FILE"; exit 1
          fi
          args=( "$IN_POST_IDS" "--file=$target" )
          case "$IN_MODE" in *"실제 적용"*) args+=( --apply ) ;; esac
          case "$IN_MODE" in
            *"섹션 끼워넣기"*)
              if [ -z "$IN_NEW_HEADING" ]; then
                echo "::error::새로 만들 소제목을 적어주세요 (new_desc)"; exit 1
              fi
              args+=( "--after=$IN_ANCHOR" "--new-heading=$IN_NEW_HEADING" )
              ;;
            *) args+=( "--heading=$IN_ANCHOR" ) ;;
          esac
          node src/wordpress/update-section.mjs "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 글 찾기
        # 검색어로 글을 찾아 제목·슬러그·현재 SEO 값을 보여준다. 아무것도 바꾸지 않는다.
        if: ${{ contains(inputs.mode, '글 찾기') }}
        working-directory: sports-news
        env:
          IN_FIND_QUERY: ${{ inputs.find_query }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_FIND_QUERY" ]; then
            echo "::error::찾을 말을 적어주세요 (예: 파3 예약)"
            exit 1
          fi
          node src/wordpress/retitle.mjs find "$IN_FIND_QUERY" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 메타 설명 채우기
        # 메타 설명이 비어 있는 글만 본문에서 뽑아 채운다.
        # 이미 설명이 있는 글은 건드리지 않고, meta 하나만 보낸다.
        #
        # '고치기'는 우리가 잘못 채운 설명(쿠팡 고지문·인사말·이모지로 시작하는
        # 것)만 찾아 덮어쓴다. 사람이 쓴 설명은 이 꼴이 되지 않으므로 건드리지
        # 않는다.
        if: ${{ contains(inputs.mode, '메타 설명') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_COUNT: ${{ inputs.count }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          # '고치기' 방식이면 --repair 를 붙인다.
          repair=""
          set -o pipefail
          case "$IN_MODE" in *"잘못 채운"*) repair="--repair" ;; esac

          case "$IN_MODE" in
            *미리보기*) node src/wordpress/fill-meta.mjs --dry-run $repair 2>&1 | tee -a "$RUNNER_TEMP/sn.log" ;;
            *)
              case "$IN_COUNT" in
                ''|*[!0-9]*) echo "::error::개수는 숫자여야 합니다: $IN_COUNT"; exit 1 ;;
              esac
              node src/wordpress/fill-meta.mjs "--limit=$IN_COUNT" $repair 2>&1 | tee -a "$RUNNER_TEMP/sn.log" ;;
          esac

      - name: 이미지 설명(alt) 채우기
        # 본문을 고치는 유일한 단계다. alt가 없거나 빈 <img>에만 설명을 넣고,
        # 저장 전에 "alt 말고 다른 게 바뀌지 않았는지"를 코드로 확인한다.
        # 고치기 전 원본 본문을 파일로 남긴다.
        if: ${{ contains(inputs.mode, '이미지 설명') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_COUNT: ${{ inputs.count }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          set -o pipefail
          case "$IN_MODE" in
            *미리보기*) node src/wordpress/fix-alt.mjs --dry-run 2>&1 | tee -a "$RUNNER_TEMP/sn.log" ;;
            *)
              case "$IN_COUNT" in
                ''|*[!0-9]*) echo "::error::개수는 숫자여야 합니다: $IN_COUNT"; exit 1 ;;
              esac
              node src/wordpress/fix-alt.mjs "--limit=$IN_COUNT" 2>&1 | tee -a "$RUNNER_TEMP/sn.log" ;;
          esac

      - name: 분류 설명 채우기
        # 글이 아니라 분류(카테고리) 아카이브의 설명을 채운다.
        # 네이버가 /category/야구 를 "설명 누락"으로 집어냈는데(2026-10-24),
        # fill-meta.mjs 는 글만 보기 때문에 그 자리에 영영 닿지 않는다.
        #
        # 비어 있는 설명에만 넣고, 이름·슬러그는 보내지 않는다 —
        # 주소가 바뀌면 네이버 색인이 끊긴다.
        if: ${{ contains(inputs.mode, '분류 설명') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_COUNT: ${{ inputs.count }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          set -o pipefail
          case "$IN_MODE" in
            *미리보기*) node src/wordpress/category-desc.mjs --dry-run 2>&1 | tee -a "$RUNNER_TEMP/sn.log" ;;
            *)
              case "$IN_COUNT" in
                ''|*[!0-9]*) echo "::error::개수는 숫자여야 합니다: $IN_COUNT"; exit 1 ;;
              esac
              node src/wordpress/category-desc.mjs "--limit=$IN_COUNT" 2>&1 | tee -a "$RUNNER_TEMP/sn.log" ;;
          esac

      - name: 중계 글 상금 제목으로 바꾸기
        # 중계 글 360편(전체의 55%)은 리포 실측상 거의 죽어 있다.
        # 본문에 상금이 적힌 글만 골라 제목을 상금 각도로 돌린다.
        # 본문과 슬러그는 건드리지 않는다 — 주소가 바뀌면 색인이 끊긴다.
        if: ${{ contains(inputs.mode, '상금 제목') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          set -o pipefail
          case "$IN_MODE" in
            *미리보기*) node src/wordpress/broadcast-retitle.mjs 2>&1 | tee -a "$RUNNER_TEMP/sn.log" ;;
            *) node src/wordpress/broadcast-retitle.mjs --apply 2>&1 | tee -a "$RUNNER_TEMP/sn.log" ;;
          esac

      - name: 글 제목·설명 고치기
        # 슬러그(주소)·상태·본문은 보내지 않는다. 제목과 메타 설명만 바꾼다.
        # 고치기 전 원본을 파일로 남긴다.
        if: ${{ contains(inputs.mode, '제목·설명 고치기') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          IN_TITLE: ${{ inputs.new_title }}
          IN_DESC: ${{ inputs.new_desc }}
          IN_KW: ${{ inputs.new_keyword }}
          IN_SEO: ${{ inputs.new_seo_title }}
          # ⚠️ 이 줄이 없어서 파일 분기가 통째로 건너뛰어졌다 (2026-11-09).
          #    run 블록에서 $IN_FILE 을 썼는데 env 에 안 넣으면 **빈 값**이고,
          #    `if [ -n "$IN_FILE" ]` 가 거짓이 되어 파일을 읽지도, 값이
          #    비었다고 멈추지도 않는다. 조용히 아무 일도 안 한다.
          IN_FILE: ${{ inputs.file_path }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          set -o pipefail
          if [ -z "$IN_IDS" ]; then
            echo "::error::고칠 글 번호를 적어주세요 (post_ids)"; exit 1
          fi
          dry=""
          case "$IN_MODE" in *미리보기*) dry="--dry-run" ;; esac

          # ── 제목·설명을 **파일에서** 읽는 길 (2026-11-09) ────────────────
          #
          # file_path 에 JSON 파일을 주면 그 안의 글자를 쓴다. 모양은
          #   { "11802": { "title": "...", "desc": "...", "keyword": "...",
          #                "seo_title": "..." } }
          # 글 번호 키가 없으면 "*" 키를 본다.
          #
          # ⚠️ **왜 만들었나.** 2026-11-09 에 제목을 손으로 넘기다 한글이
          #    일곱 번 깨졌다(`16씵`·`신지에`·`평금타수`·`놓쫌`·`추피언십`).
          #    그중 **두 번이 '실제 적용' 모드**였고, 발행된 글 제목이 깨진
          #    글자로 바뀔 상황이었다. 둘 다 취소해서 막았지만 막은 것은
          #    운이 아니라 눈이었고, 눈은 매번 안 걸린다.
          #
          #    파일로 쓴 한글은 한 번도 깨지지 않았다. 되돌릴 수 없는 쪽
          #    (발행된 글의 제목)에 닿는 값은 **파일을 거치게** 한다.
          #    입력으로 직접 주는 길은 그대로 둔다 — 짧은 값에는 편하다.
          if [ -n "$IN_FILE" ]; then
            target="$IN_FILE"
            if [ ! -f "$target" ] && [ -f "../$IN_FILE" ]; then target="../$IN_FILE"; fi
            if [ ! -f "$target" ]; then
              echo "::error::제목 파일을 찾을 수 없습니다: $IN_FILE"
              echo "제목 파일을 찾을 수 없습니다: $IN_FILE" >> "$RUNNER_TEMP/sn.log"
              exit 1
            fi
            echo "제목·설명을 파일에서 읽습니다: $target" | tee -a "$RUNNER_TEMP/sn.log"
          fi

          for id in $IN_IDS; do
            case "$id" in
              ''|*[!0-9]*) echo "::error::글 번호는 숫자여야 합니다: $id"; exit 1 ;;
            esac
            # 파일을 줬으면 이 글의 값을 꺼낸다. 없는 칸은 빈 문자열이라
            # 아래 ${VAR:+...} 가 그대로 걸러 준다.
            T="$IN_TITLE"; D="$IN_DESC"; K="$IN_KW"; S="$IN_SEO"
            if [ -n "$IN_FILE" ]; then
              T=$(node -e 'const f=require(process.argv[1]);const o=f[process.argv[2]]||f["*"]||{};process.stdout.write(o.title||"")' "$PWD/$target" "$id" 2>/dev/null || true)
              D=$(node -e 'const f=require(process.argv[1]);const o=f[process.argv[2]]||f["*"]||{};process.stdout.write(o.desc||"")' "$PWD/$target" "$id" 2>/dev/null || true)
              K=$(node -e 'const f=require(process.argv[1]);const o=f[process.argv[2]]||f["*"]||{};process.stdout.write(o.keyword||"")' "$PWD/$target" "$id" 2>/dev/null || true)
              S=$(node -e 'const f=require(process.argv[1]);const o=f[process.argv[2]]||f["*"]||{};process.stdout.write(o.seo_title||"")' "$PWD/$target" "$id" 2>/dev/null || true)
              if [ -z "$T$D$K$S" ]; then
                echo "::error::$id 에 해당하는 값이 파일에 없습니다"
                echo "$id 에 해당하는 값이 파일에 없습니다 ($target)" >> "$RUNNER_TEMP/sn.log"
                exit 1
              fi
            fi
            # 값에 공백이 들어가므로 셸이 쪼개지 않게 큰따옴표로 넘긴다.
            # 비어 있는 입력은 ${VAR:+...} 로 아예 빼서, 빈 값으로 덮어쓰지 않는다.
            # retitle.mjs 는 set 서브커맨드를 먼저 받는다 (argv[2]=set, argv[3]=글번호).
            node src/wordpress/retitle.mjs set "$id" $dry \
              ${T:+--title="$T"} \
              ${D:+--desc="$D"} \
              ${K:+--kw="$K"} \
              ${S:+--seo="$S"} 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          done

      - name: 중계 배너 넣기
        # 이미 올린 글에 '경기 보러가기' 배너를 넣는다. config/watch-links.json 에
        # 사람이 확인해 적어둔 주소만 쓴다 — 코드가 주소를 만들어내지 않는다.
        # 넣기만 한다. 원래 있던 글자는 하나도 지우거나 바꾸지 않고, 저장 전에
        # 코드로 확인한다. 고치기 전 원본 본문을 파일로 남긴다.
        if: ${{ contains(inputs.mode, '중계 배너') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          IN_COUNT: ${{ inputs.count }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          set -o pipefail
          # '전체 훑기' 는 글 번호가 필요 없다. 발행글을 전부 본다.
          case "$IN_MODE" in
            *전체\ 훑기*|*배너\ 빼기*)
              dry='--dry-run'
              case "$IN_MODE" in *실제\ 적용*) dry='' ;; esac
              # 빼기는 넣기와 섞지 않는다. 지우는 쪽이라 따로 간다.
              rm=''
              case "$IN_MODE" in *배너\ 빼기*) rm='--빼기' ;; esac
              # count 는 읽지 않는다. 기본값이 '1' 이라 그대로 쓰면 한 편만
              # 돌아가는 함정이 된다. 전체 훑기는 제한 없이 가고, 몇 편이
              # 바뀌는지는 미리보기로 먼저 본다.
              node src/wordpress/add-watch.mjs --all --유형=중계 $rm $dry 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
              exit 0
              ;;
          esac
          if [ -z "$IN_IDS" ]; then
            echo "::error::글 번호를 적어주세요 (post_ids). 예: 7690. 전부 훑으려면 '중계 배너 전체 훑기'를 고르세요."
            exit 1
          fi
          how=''
          case "$IN_MODE" in
            *상태\ 보기*) how='--show --html' ;;
            *미리보기*) how='--dry-run' ;;
          esac
          node src/wordpress/add-watch.mjs $IN_IDS $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"

      - name: 앱·공식 홈페이지 배너 넣기
        # 이미 올린 글에 앱 다운로드·구단 공식 홈페이지 배너를 넣는다.
        # config/app-links.json, config/official-links.json 에 사람이 확인해
        # 적어둔 주소만 쓴다 — 코드가 주소를 만들어내지 않는다.
        # 넣기만 한다. 원래 글자는 하나도 지우거나 바꾸지 않고 저장 전에 확인한다.
        # 고치기 전 원본 본문을 파일로 남긴다. AI 를 부르지 않으므로 0원이다.
        if: ${{ contains(inputs.mode, '홈페이지 배너') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          set -o pipefail
          # '전체 훑기' 는 글 번호가 필요 없다. 발행글을 전부 본다.
          case "$IN_MODE" in
            *전체\ 훑기*)
              how=''
              case "$IN_MODE" in *실제\ 적용*) how='--apply' ;; esac
              # count 는 읽지 않는다 (기본값 '1' 함정). 위 중계 쪽과 같다.
              node src/wordpress/add-banner.mjs --all $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
              exit 0
              ;;
          esac
          if [ -z "$IN_IDS" ]; then
            echo "::error::글 번호를 적어주세요 (post_ids). 예: 7801. 전부 훑으려면 '앱·공식 홈페이지 배너 전체 훑기'를 고르세요."
            exit 1
          fi
          how=''
          case "$IN_MODE" in
            *실제\ 적용*) how='--apply' ;;
          esac
          node src/wordpress/add-banner.mjs $IN_IDS $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 광고가 페이지에 나가는지 보기
        # ads.txt 와 발행된 페이지를 받아 광고 흔적을 센다. **읽기만 한다** —
        # 광고 코드를 넣거나 고치거나 지우지 않는다(운영자 지시).
        # 이 리포는 쿠팡 광고만 넣고 애드센스는 테마·플러그인에 있어서,
        # 코드만 봐서는 알 수 없고 실제 페이지를 봐야 한다.
        if: ${{ contains(inputs.mode, '광고가 페이지에') }}
        working-directory: sports-news
        env:
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: node src/wordpress/ad-check.mjs $IN_IDS

      - name: 사이트맵 점검
        # 사이트맵이 구글에 URL 을 실제로 주고 있는지 본다. 고치지 않는다.
        # 2026-10-20: 제출한 /sitemap.xml 의 "발견된 총 페이지 수 0" 이었다.
        if: ${{ contains(inputs.mode, '사이트맵') }}
        working-directory: sports-news
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
          IN_FIND_QUERY: ${{ inputs.find_query }}
        run: |
          # 찾을 말 칸에 주소를 적으면 그 사이트를 본다. 비우면 wiki 를 본다.
          # (2026-10-20: 서치콘솔에서 보던 숫자가 wiki 것이 아닐 수 있어서)
          extra=''
          case "$IN_FIND_QUERY" in
            http://*|https://*) extra="--base=$IN_FIND_QUERY" ;;
          esac
          node src/wordpress/sitemap-check.mjs $extra 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 색인이 안 되는 이유 찾기
        # 발행된 글을 전부 받아 중복·분량·빈 SEO 필드를 센다. **읽기만 한다.**
        #
        # 2026-10-09 서치콘솔: 색인 8개 / "크롤링됨 - 현재 색인이 생성되지 않음"
        # 148개. 이 상태는 오류가 아니라 구글이 읽고 "올릴 만하지 않다"고 판단한
        # 것이라, 사이트맵 재제출로는 풀리지 않는다. 무엇을 손볼지 정하려면
        # 먼저 세야 한다.
        if: ${{ contains(inputs.mode, '색인이 안 되는 이유') || contains(inputs.mode, '겹치는 글 전부') || contains(inputs.mode, '보강 1순위') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          # '겹치는 글 전부 보기' 는 목록을 자르지 않는다. 겹친 글의 각도를
          # 손보려면 25묶음만 봐서는 못 하기 때문이다.
          all=''
          case "$IN_MODE" in
            *겹치는\ 글\ 전부*) all='--겹침만' ;;
            *보강\ 1순위*) all='--보강만' ;;
          esac
          node src/wordpress/index-audit.mjs $all 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 시설 글 섞인 이름 찾기
        # **읽기만 한다.** 시설 글 본문에 **다른 시설 이름**이 들어 있는지 센다.
        #
        # 2026-10-19 보강 1순위 글 1693(제일CC 파3)을 열어 보고 만들었다.
        # 제일CC 요금을 보러 온 독자에게 **리베라CC 요금(비회원 평일 21만원)이
        # 먼저** 나오고, 문장이 중간에서 잘린 채 이어붙어 있었다
        # ("티켓을 받으제일CC", "대기 시간은 약 30분~1시간 발제일CC").
        # 파3 글 24편이 같은 시기에 같은 틀로 찍혔으니 한 편에서 났으면
        # 여럿에서 났을 가능성이 높다 — 눈으로 찾지 않고 기계로 센다.
        #
        # 분량을 늘리는 것보다 이게 먼저다. 틀린 요금은 신뢰를 바로 깎는다.
        if: ${{ contains(inputs.mode, '섞인 이름') }}
        working-directory: sports-news
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          node src/wordpress/facility-mix.mjs 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 용접된 문단 풀기
        # 한 문단에 **두 글이 들어 있는** 자리를 푼다. 앞 토막만 버리고
        # 뒤 토막은 한 글자도 바꾸지 않는다 — 새 문장을 쓰지 않으므로
        # 지어낸 글자가 들어갈 여지가 없고, 돈도 들지 않는다.
        #
        # 2026-10-19 1693(제일CC 파3)에서 세 문단이 이렇게 생긴 것을 봤다.
        #   "리베라CC 파3 이용료는 본 코스(비회원 평일 210,000원~ 주말
        #    280,000원대)보다 훨씬 저렴해 … 실제 이용자 제일CC 파3
        #    골프장의 이용료는 …"
        # 제일CC 요금을 보러 온 독자가 리베라CC 요금을 먼저 읽는다.
        if: ${{ contains(inputs.mode, '용접된 문단') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          apply=''
          case "$IN_MODE" in *실제\ 적용*) apply='--apply' ;; esac
          node src/wordpress/fix-glued.mjs $IN_IDS $apply 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 한 이미지의 alt 둘을 하나로
        # 한 <img> 에 alt 가 둘 들어간 것을 하나로 돌린다.
        # **중복 속성은 앞의 것이 이긴다** — 맞는 alt 를 넣어도 버려진다.
        #
        # 2026-10-19 1650(서평택골프클럽 파3)에서 '용인 88CC' 가 여섯 번
        # 나왔다. 본문은 깨끗했고 전부 alt 안이었다. fix-alt 의 HAS_ALT 가
        # `(.*?)` 라 여러 줄 alt 를 없는 것으로 보고 하나 더 붙였다
        # (그 정규식과 저장 전 가드는 같이 고쳤다).
        #
        # 다른 골프장 이름을 여덟 줄 나열한 alt 는 구글 스팸 정책에 걸리는
        # 모양새라 그냥 둘 수 없다.
        if: ${{ contains(inputs.mode, 'alt 둘') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          apply=''
          case "$IN_MODE" in *실제\ 적용*) apply='--apply' ;; esac
          # 번호를 적지 않고 전부 고치는 길. 막는 것은 번호가 아니라 글마다
          # 하는 '남길것이맞나' 확인이고, 그 확인을 통과한 글만 고친다.
          case "$IN_MODE" in *통과한\ 글\ 전부*) apply="$apply --전부" ;; esac
          node src/wordpress/dup-alt.mjs $IN_IDS $apply 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 보강 1순위에 무엇이 모자란지 세기
        # **읽기만 한다.** 글자수만 보고 돈을 쓰지 않으려고 만들었다.
        #
        # sports-news/CLAUDE.md ②절이 구글 문서를 인용해 "콘텐츠 길이 자체는
        # 순위 결정과 관련 없습니다" 를 못 박았고, "없으면 그대로 둔다" 까지
        # 적어 두었다. 실제로 1693 은 분량이 아니라 오류였고(리베라CC 요금이
        # 먼저 나왔다), 1650 은 alt 가 남의 골프장 이름이었다.
        #
        # 62편 × 190~370원 = 1만 2천~2만 3천원이다. 돈을 쓸 글과 0원으로
        # 고칠 글과 그대로 둘 글을 먼저 가른다.
        if: ${{ contains(inputs.mode, '무엇이 모자란지') }}
        working-directory: sports-news
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          node src/wordpress/reinforce-scan.mjs 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 같은 대회 짝 찾기
        # **읽기만 한다.** 같은 대회를 두 번 쓴 글 짝을 고른다.
        #
        # index-audit 의 묶음을 그대로 믿고 안내를 걸면 독자를 엉뚱한 글로
        # 보낸다 — 2026-10-19 에 실제로 아시안투어 홍콩 오픈 ↔ 프랑스 오픈,
        # 대학농구 ↔ 대학배구, ITTF ↔ WTT 가 한 묶음으로 나왔다. 그래서
        # "제목 차이가 전부 유형어일 때만 같은 대회"라는 좁은 규칙을 따로 쓴다.
        if: ${{ contains(inputs.mode, '같은 대회 짝') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          all=''
          case "$IN_MODE" in *건너뛴\ 것까지*) all='--버린것도' ;; esac
          node src/wordpress/same-event.mjs $all 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 안내 여러 쌍에 넣기
        # 쌍마다 가리킬 곳이 다른 안내를 한 번에 넣는다. add-notice 는 한 번에
        # 한 곳만 가리키므로(--to 가 하나다) 222쌍이면 액션을 222번 돌려야 한다.
        # 안전선은 add-notice 의 것을 그대로 재사용한다.
        if: ${{ contains(inputs.mode, '안내 여러 쌍에') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_FILE: ${{ inputs.file_path }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_FILE" ]; then
            echo "::error::짝 목록 파일 경로를 적어주세요 (file_path)"; exit 1
          fi
          target="$IN_FILE"
          if [ ! -f "$target" ] && [ -f "../$IN_FILE" ]; then target="../$IN_FILE"; fi
          if [ ! -f "$target" ]; then
            echo "::error::파일을 찾을 수 없습니다: $IN_FILE"; exit 1
          fi
          apply=''
          case "$IN_MODE" in *실제\ 적용*) apply='--apply' ;; esac
          node src/wordpress/notice-batch.mjs "$target" $apply 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 수명 끝난 글 색인에서 빼기
        # 끝난 대회의 중계 안내처럼 수명이 끝난 글을 색인 대상에서 뺀다.
        # 본문·제목·슬러그·발행상태는 건드리지 않고 robots 칸 하나만 쓴다.
        # 기본은 미리보기이고, 모드에 '실제 적용'이 있을 때만 --apply 가 붙는다.
        if: ${{ contains(inputs.mode, '색인에서 빼기') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          # 기준은 count 칸으로 넓힌다. 비워두면 기본값(1500자)이다.
          NOINDEX_MAX_CHARS: ${{ inputs.noindex_max_chars }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          how=''
          case "$IN_MODE" in
            *실제\ 적용*) how='--apply' ;;
          esac
          node src/wordpress/noindex.mjs $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 오타 고치기
        # 제목·본문의 오타를 고친다. **표에 적힌 것만** 고친다 — 한국어
        # 맞춤법을 코드가 판단할 수는 없고, 글이 633편이라 한 번 잘못 고치면
        # 633편이 틀린다.
        #
        # '오타 후보 찾기' 는 아무것도 고치지 않는다. 딱 한 번 나오고 자주
        # 나오는 말과 한 글자만 다른 낱말을 보여줄 뿐이다. 사람이 보고 맞다고
        # 판단한 것만 바로잡기 표에 들어간다.
        #
        # 슬러그는 보내지 않는다 — 주소가 바뀌면 네이버가 들고 있는 주소가
        # 깨진다 (네이버 색인을 끊지 않는다는 안전선).
        if: ${{ contains(inputs.mode, '오타') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          how=''
          case "$IN_MODE" in
            *후보\ 찾기*) how='--찾기' ;;
            *실제\ 적용*) how='--apply' ;;
          esac
          # 글 번호를 적으면 그 글만 손댄다. 표에는 예전에 넣고 적용하지
          # 않은 항목이 남아 있을 수 있어서, "오늘 이 글만" 이 필요하다.
          node src/wordpress/typo-fix.mjs $how $IN_IDS 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 깨진 표 고치기
        # 마크다운 표가 문단 하나로 뭉쳐 나간 글을 표 블록으로 되돌린다.
        #
        # 2026-11-05. markdownToBlocks 가 표를 몰라서
        # `<p>| 항목 | 값 |<br>|---|---|…</p>` 가 독자 화면에 그대로 찍혔다.
        # 변환기는 같은 날 고쳤지만 이미 나간 글은 안 바뀐다.
        #
        # 셀 안의 글자는 건드리지 않는다 — 이미 <strong> 같은 태그로 바뀐
        # 상태라 다시 손대면 태그가 깨진다. 칸을 나누고 감싸기만 한다.
        # 저장 전에 표 말고 다른 글자가 바뀌지 않았는지 코드로 확인한다.
        #
        # 본문만 보낸다. 슬러그는 보내지 않는다 — 주소가 바뀌면 네이버가
        # 들고 있는 주소가 깨진다.
        if: ${{ contains(inputs.mode, '깨진 표') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_IDS" ]; then
            echo "::error::고칠 글 번호를 적어주세요 (post_ids). 예: 11861 11849"; exit 1
          fi
          how=''
          case "$IN_MODE" in *실제\ 적용*) how='--apply' ;; esac
          node src/wordpress/fix-tables.mjs $how $IN_IDS 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 글자로 남은 링크 고치기
        # `[글자](주소)` 가 글자 그대로 남은 글을 실제 링크로 바꾼다.
        #
        # 2026-11-06. markdownToBlocks 의 inline 처리가 링크를 모르던 때
        # 쓴 글에 대괄호와 주소가 그대로 찍혀 있다. 보기 나쁜 것보다 나쁜
        # 것은 **누를 수 없다는 것**이다 — 구글이 글끼리 이어진 길로
        # 페이지를 찾는데 그 길이 끊긴다(지시서 ② 절).
        #
        # 쿠팡 광고 블록은 가려 두고 바꾼다 — 제휴사가 준 코드다.
        # 저장 전에 링크 말고 다른 글자가 바뀌지 않았는지 코드로 확인한다.
        #
        # 본문만 보낸다. 슬러그는 보내지 않는다 — 주소가 바뀌면 네이버가
        # 들고 있는 주소가 깨진다.
        if: ${{ contains(inputs.mode, '글자로 남은 링크') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_IDS" ]; then
            echo "::error::고칠 글 번호를 적어주세요 (post_ids). 예: 11861 11849"; exit 1
          fi
          how=''
          case "$IN_MODE" in *실제\ 적용*) how='--apply' ;; esac
          node src/wordpress/fix-mdlinks.mjs $how $IN_IDS 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 쿠팡 하단 고정 바
        # 화면 아래에 작게 붙는 쿠팡 바를 글에 넣는다 / 뺀다.
        #
        # 2026-11-07. 쿠팡 수익이 사실상 0 이었고, 잡힌 구매도 거의 운영자
        # 본인 집 구매였다. 글마다 쿠팡 블록이 첫 문단 뒤 하나뿐이라
        # 독자가 답을 읽고 나가는 지점에는 아무것도 없었다.
        #
        # 운영자가 전면 팝업을 꺼냈지만 그쪽은 구글이 순위를 깎는 것이
        # 확인된 방식이다(모바일 검색 직후 콘텐츠를 가리는 인터스티셜).
        # 그래서 화면을 가리지 않는 하단 고정 바로 간다 — 운영자 선택.
        #
        # 글 번호를 적으면 그 글만, post_ids 에 '전체' 라고 적으면 발행 글
        # 전부를 돈다. 쿠팡 코드는 제휴사가 준 그대로 쓰고 감싸는 상자와
        # 닫기 버튼만 우리 것이다. 되돌리는 길(빼기)을 같이 둔다.
        if: ${{ contains(inputs.mode, '하단 고정 바') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_IDS" ]; then
            echo "::error::글 번호를 적어주세요 (post_ids). 전부 하려면 all, 바를 가진 글만 고치려면 refresh 라고 적으세요"; exit 1
          fi
          args=()
          case "$IN_MODE" in *실제\ 적용*) args+=( --apply ) ;; esac
          case "$IN_MODE" in *빼기*) args+=( --빼기 ) ;; esac
          case "$IN_IDS" in
            전체|전부|all) args+=( --전체 ) ;;
            # 바를 **이미 가진 글만** 고친다. 바 모양을 바꿀 때 쓴다 —
            # all 은 바가 없는 글에 새로 깔기까지 한다(2026-11-09 결정).
            # ⚠️ 한글을 입력칸에 적으면 깨지므로 영문 낱말로 둔다.
            refresh|update) args+=( --전체 --갱신만 ) ;;
            *) for id in $IN_IDS; do args+=( "$id" ); done ;;
          esac
          node src/wordpress/add-sticky.mjs "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 본문 쿠팡 상품 광고
        # 글 **본문 안**에 쿠팡 상품 광고를 넣는다 / 뺀다. (2026-11-14)
        #
        # 운영자가 쿠팡 실적을 보여줬고, 숫자를 읽어 보니 구매 19건이
        # 전부 가족 구매였다. 독자 구매는 아직 0 건이다. 전환율 118% 는
        # 그래서 나온 가짜 신호다. 막힌 것은 클릭 하나뿐이다.
        #
        # 지금 쿠팡 광고는 하단 바의 캐러셀 하나뿐이고 글 내용과 상관없는
        # 상품이 돈다. 운영자가 상품을 직접 골라 "전부 범용성 있는 상품으로
        # 고정하자"고 정했다(2026-11-14).
        #
        # ⚠️ 하단 바가 아니라 본문이다. 받은 태그가 120×240 이라 바에 넣으면
        #    고지문·여백까지 약 300px 이 되고, 모바일 세로 640~740 에서
        #    화면의 40% 를 덮는다 — 광고 원칙 3번("화면을 가로막지 않는다").
        #    본문은 스크롤로 지나가는 자리라 걸리지 않는다. 그리고 바를
        #    그대로 두면 바뀌는 것이 본문 하나뿐이라 효과가 갈린다.
        #
        # ⚠️ 고지문을 이 블록이 스스로 가진다. 바에는 닫기 버튼이 있어서
        #    독자가 닫으면 고지문이 같이 사라지고 본문 광고만 남는다.
        #
        # 상품을 바꿀 때는 config/ad-coupang-products.html 만 고치고
        # post_ids 에 refresh 를 적어 돌린다 — 이미 가진 글만 갈아끼운다.
        if: ${{ contains(inputs.mode, '본문 쿠팡 상품') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_IDS" ]; then
            echo "::error::글 번호를 적어주세요 (post_ids). 전부 하려면 all, 광고를 가진 글만 갈아끼우려면 refresh 라고 적으세요"; exit 1
          fi
          args=()
          case "$IN_MODE" in *실제\ 적용*) args+=( --apply ) ;; esac
          case "$IN_MODE" in *빼기*) args+=( --빼기 ) ;; esac
          case "$IN_IDS" in
            전체|전부|all) args+=( --전체 ) ;;
            # 광고를 **이미 가진 글만** 고친다. 상품을 바꿀 때 쓴다.
            # ⚠️ 한글을 입력칸에 적으면 깨지므로 영문 낱말로 둔다.
            refresh|update) args+=( --전체 --갱신만 ) ;;
            *) for id in $IN_IDS; do args+=( "$id" ); done ;;
          esac
          node src/wordpress/add-product-ad.mjs "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"
          exit "${PIPESTATUS[0]}"

      - name: 쿠팡 광고 아래 여백
        # 운영자: "광고랑 글 사이에 간격이 좀 있으면 좋겠다. 간격이 없이
        # 너무 붙어 있으니 글을 읽는 게 너무 안 좋은 것 같다" (2026-11-07)
        #
        # 쿠팡 검색창(44px) 바로 다음 줄에 소제목이 붙어 광고와 본문이
        # 한 덩어리로 보였다. 쿠팡 코드는 건드리지 않고 **뒤에 빈 칸만**
        # 붙인다. 워드프레스 기본 스페이서 블록이라 테마가 바뀌어도 남는다.
        #
        # 하단 고정 바는 건너뛴다 — 그쪽은 제 여백을 스스로 준다.
        if: ${{ contains(inputs.mode, '광고 아래 여백') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_IDS" ]; then
            echo "::error::글 번호를 적어주세요 (post_ids). 전부 하려면 '전체' 라고 적으세요"; exit 1
          fi
          args=()
          case "$IN_MODE" in *실제\ 적용*) args+=( --apply ) ;; esac
          case "$IN_MODE" in *여백\ 빼기*) args+=( --빼기 ) ;; esac
          case "$IN_IDS" in
            전체|전부|all) args+=( --전체 ) ;;
            *) for id in $IN_IDS; do args+=( "$id" ); done ;;
          esac
          node src/wordpress/space-ad.mjs "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 휴지통 링크를 남긴 글로 돌려주기
        # 지운 글을 가리키는 링크를, 같은 시설을 다룬 남은 글로 보낸다.
        # 짝은 config/relink.json 에 사람이 적은 것만 쓴다 — 코드가 추측하지
        # 않는다. 틀린 글로 보내는 링크는 깨진 링크보다 나쁘다.
        if: ${{ contains(inputs.mode, '돌려주기') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          how=''
          case "$IN_MODE" in
            *실제\ 적용*) how='--apply' ;;
          esac
          node src/wordpress/relink-trashed.mjs $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 글자로만 적힌 주소를 링크로
        # 본문에 글자로만 적힌 주소를 누를 수 있는 링크로 바꾼다.
        #
        # 효성님: "URL 주소를 그대로 노출하면 무슨 소용인가. 배너로 만들어
        # 누르면 넘어 갈 수 있게 해라." 공식 홈페이지·스토어는 byPost
        # 배너로 끝냈고, 이것은 본문에 남은 주소를 맡는다.
        #
        # **주소를 만들어내지 않는다** — 설정(official-links.json)에 사람이
        # 적고 _출처를 남긴 호스트만 링크로 만든다. 가짜 쇼핑몰을 가르려고
        # 보여 주는 주소(한화 글)와 쿠팡 광고 블록은 건드리지 않는다.
        if: ${{ contains(inputs.mode, '적힌 주소를 링크로') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_IDS" ]; then
            echo "::error::글 번호를 적어주세요 (post_ids)"; exit 1
          fi
          args=()
          case "$IN_IDS" in
            전체|전부|all) args+=( --전체 ) ;;
            *) for id in $IN_IDS; do args+=( "$id" ); done ;;
          esac
          case "$IN_MODE" in *실제\ 적용*) args+=( --apply ) ;; esac
          node src/wordpress/link-urls.mjs "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 누를 수 없는 주소 세기
        # 본문에 주소가 **글자로만** 적힌 글을 센다. 아무것도 고치지 않는다.
        #
        # 2026-11-08 효성님: "URL 주소를 그대로 노출하면 무슨 소용인가.
        # 배너로 만들어 누르면 넘어 갈 수 있게 해라. 다른 글도 점검해라."
        # 구단 스토어 10편은 byPost 배너로 고쳤고, 이것이 그 "다른 글도"다.
        #
        # 가짜 쇼핑몰을 가르려고 주소를 보여 주는 문장(한화 글)은 건너뛰고,
        # 건너뛴 수를 따로 찍는다 — 숨기지 않는다.
        if: ${{ contains(inputs.mode, '누를 수 없는 주소') }}
        working-directory: sports-news
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          node src/wordpress/bare-urls.mjs --limit=60 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 휴지통 때문에 깨진 링크 세기
        # 휴지통으로 보낸 글을 아직 가리키는 글을 센다. 아무것도 고치지 않는다.
        # 깨진 링크를 두면 구글이 그 경로로 들어와 404 를 받는다.
        if: ${{ contains(inputs.mode, '깨진 링크') }}
        working-directory: sports-news
        env:
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          node src/wordpress/broken-links.mjs 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 중복 글 휴지통으로 보내기
        # 같은 시설을 다룬 글이 둘이라 구글이 어느 쪽도 올리지 않을 때,
        # **사람이 고른 한 편**을 휴지통으로 보낸다.
        #
        # noindex.mjs 머리말의 "왜 삭제가 아닌가" 는 그대로 유효하다 —
        # 수명이 끝난 글 수백 편을 코드가 골라 지우는 일은 하지 않는다.
        # 이 모드는 운영자가 번호를 직접 적을 때만 돈다.
        #
        # 휴지통으로만 보낸다. 영구 삭제하는 길은 도구에 아예 없다.
        # 지우기 전에 본문 전체를 파일로 남기고, 그 글을 가리키는 다른 글을
        # 세어 보여준다 — 지우면 그 링크들이 깨진 링크가 되고, 구글은 링크로
        # 페이지를 찾는다.
        # '깨진 링크 세기' 모드 이름에도 '휴지통' 이 들어간다. 그 모드로 돌렸을
        # 때 이 단계까지 함께 돌아 "글 번호를 적어주세요" 로 죽었다(2026-10-20).
        if: ${{ contains(inputs.mode, '휴지통') && !contains(inputs.mode, '깨진 링크') && !contains(inputs.mode, '돌려주기') && !contains(inputs.mode, '사이트맵') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_IDS" ]; then
            echo "::error::지울 글 번호를 적어주세요 (post_ids)"; exit 1
          fi
          how=''
          case "$IN_MODE" in *실제\ 적용*) how='--apply' ;; esac
          node src/wordpress/delete-post.mjs $IN_IDS $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 임시글 발행하기
        # **사람이 글을 보고 번호를 지목했을 때만** 임시글을 발행한다.
        #
        # 안전선의 "임시글(draft)로만 저장한다. 자동 발행하지 않는다" 는
        # 그대로다 — 글 쓰는 단계들은 지금도 `status: 'draft'` 만 보낸다.
        # 그 말의 뜻은 **사람이 읽기 전에 세상에 나가지 않는다**는 것이고,
        # 이 모드는 그 반대쪽이다. 2026-11-09 효성님이 임시글 둘을 두고
        # "발행해" 라고 했다. 사람이 지목한 발행은 자동 발행이 아니다.
        #
        # 번호를 적지 않으면 아무것도 하지 않는다. '전체' 같은 길은 없다.
        # 한 번에 5편까지만 받는다 — 되돌릴 수 없는 일에 "전부" 를 주면
        # 손이 미끄러지는 순간이 곧 사고다.
        #
        # 이미 발행된 글은 손대지 않는다(2026-11-03 에 그 사이 발행된 글을
        # 지우려 한 일이 있었다 — 허락은 그때의 사실 위에서 받은 것이다).
        # 보내는 것은 `status` 하나뿐이다. 제목·본문·슬러그는 보내지 않는다.
        if: ${{ contains(inputs.mode, '임시글 발행') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_IDS" ]; then
            echo "::error::발행할 글 번호를 적어주세요 (post_ids). 전체 발행하는 길은 없습니다"; exit 1
          fi
          how=''
          case "$IN_MODE" in *실제\ 발행*) how='--apply' ;; esac
          node src/wordpress/publish-post.mjs $IN_IDS $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 주소의 이미지를 우리 미디어에 올리기
        # 인터넷 주소의 이미지를 받아 **우리 워드프레스 미디어**에 올린다.
        #
        # 2026-11-09 효성님이 기사 이미지 주소를 주며 "이미지 그대로 끼워
        # 넣으면 안 되나" 고 물었다. 넣는 것이 맞다 — 명단을 글자로 옮기면
        # 이름 한 글자가 틀릴 수 있고, 이미지는 원본 그대로다.
        #
        # ⚠️ **이 단계가 러너에서 도는 것이 핵심이다.** 내 컨테이너는 뉴스
        #    사이트를 프록시가 막아(403) 받을 수가 없다. 러너는 다른
        #    네트워크라 받아진다.
        #
        # ⚠️ **남의 서버 주소를 글에 그대로 쓰지 않는다.** 뉴스 CDN 주소는
        #    기사가 내려가면 같이 죽는다. 우리 미디어에 올려야 안 끊긴다.
        #
        # 받은 것이 진짜 그림인지 머리 바이트로 확인하고 올린다 — 막힌 요청이
        # HTML 오류 페이지를 200 으로 돌려주는 일이 흔하다.
        if: ${{ contains(inputs.mode, '우리 미디어에 올리기') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_URLS: ${{ inputs.find_query }}
          IN_ALT: ${{ inputs.new_title }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_URLS" ]; then
            echo "::error::이미지 주소를 적어주세요 (find_query 칸에 넣습니다. 여러 개면 띄어쓰기로 나눕니다)"; exit 1
          fi
          if [ -z "$IN_ALT" ]; then
            echo "::error::이미지 설명을 적어주세요 (new_title 칸). 빈 alt 로 올리면 나중에 고치는 일이 따로 생깁니다"; exit 1
          fi
          how=''
          case "$IN_MODE" in *실제\ 적용*) how='--apply' ;; esac
          node src/wordpress/upload-url.mjs --alt="$IN_ALT" $how $IN_URLS 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 쿠팡 광고를 첫 문단 뒤로
        # 본문 맨 앞에 박힌 쿠팡 블록을 첫 문단 뒤로 내린다.
        #
        # 2026-10-15 운영자 캡처: 글을 열면 모바일 첫 화면이 제목 → 쿠팡
        # 캐러셀 → 고지문 → 검색창 → 애드센스 자리 순이라 **본문이 한 줄도
        # 안 보인다.** CTR 11~23% 로 어렵게 데려온 사람이 광고만 보고 나간다.
        #
        # 광고를 빼지 않는다. 자리만 옮긴다. 쿠팡 블록 말고 본문 글자가
        # 하나라도 바뀌면 그 글은 저장하지 않는다.
        if: ${{ contains(inputs.mode, '쿠팡 광고를') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          set -o pipefail
          how=''
          case "$IN_MODE" in *실제\ 적용*) how='--apply' ;; esac
          # 글 번호를 적으면 그 글만, 안 적으면 발행글 전체를 훑는다.
          if [ -n "$IN_IDS" ]; then
            node src/wordpress/move-coupang.mjs $IN_IDS $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          else
            node src/wordpress/move-coupang.mjs --all $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          fi

      - name: 카드 이미지 다시 굽기
        # 이미 올라간 글의 텍스트 카드만 다시 구워 갈아끼운다. AI를 부르지
        # 않으므로 0원이다. 다만 **카드를 그리므로 한글 폰트가 필요하다** —
        # 위 폰트 단계 조건에 이 방식을 따로 더해 뒀다.
        if: ${{ contains(inputs.mode, '카드 이미지 다시 굽기') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_POST_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          set -o pipefail
          if [ -z "$IN_POST_IDS" ]; then
            echo "::error::글 번호를 적어주세요 (post_ids)"; exit 1
          fi
          args="$IN_POST_IDS"
          case "$IN_MODE" in *"실제 적용"*) args="$args --apply" ;; esac
          node src/wordpress/recard.mjs $args 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 글 본문 보기
        # 글 하나의 본문을 읽기 좋게 찍는다. **읽기만 한다.**
        # 사실을 바로잡으려면 본문에 그 숫자가 어떤 문장으로 적혀 있는지
        # 알아야 한다 — 찾아 바꾸기는 글자가 하나라도 다르면 안 걸린다.
        if: ${{ contains(inputs.mode, '글 본문 보기') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          IN_FIND: ${{ inputs.find_query }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_IDS" ]; then
            echo "::error::볼 글 번호를 적어주세요 (post_ids)"; exit 1
          fi
          # find_query 를 주면 그 말이 든 문단만 찍는다.
          # 'raw' 모드는 태그를 걷어내지 않는다 — 찾아 바꾸기에 쓸 문자열을
          # 정확히 잡아야 할 때 쓴다.
          raw=''
          case "$IN_MODE" in *raw*) raw='--raw' ;; esac
          # 소제목만 보는 모드. 섹션 갈아끼우기의 --heading= 에 줄 값을 받으려고
          # 쓴다. 글이 길면 로그 끝 60줄에 소제목이 안 들어와 추측하게 되고,
          # 엉뚱한 소제목에 맞으면 다른 절을 갈아끼운다. 그래서 따로 둔다.
          headings=''
          case "$IN_MODE" in *소제목만*) headings='--headings' ;; esac
          node src/wordpress/show-post.mjs $IN_IDS $raw $headings ${IN_FIND:+--찾기="$IN_FIND"} 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 올해 글 안내 넣기
        # 작년 글 맨 위에 "올해 글로 가는 한 줄"을 넣는다. 작년 글은 이미
        # 색인이 붙어 노출을 받는데 들어온 사람이 찾는 건 올해 날짜다.
        # 지우면 그 순위를 통째로 버리게 되므로, 지우지 않고 흘려보낸다.
        #
        # content 하나만 보낸다. 제목·슬러그·발행상태는 보내지 않는다.
        # 주소는 운영자가 적은 것만 쓴다 — 코드가 만들어내지 않는다.
        if: ${{ contains(inputs.mode, '올해 글 안내') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          IN_TEXT: ${{ inputs.notice_text }}
          IN_URL: ${{ inputs.notice_url }}
          IN_TO: ${{ inputs.notice_to }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_IDS" ]; then
            echo "::error::안내를 넣을 글 번호를 적어주세요 (post_ids)"; exit 1
          fi
          if [ -z "$IN_URL" ] && [ -z "$IN_TO" ]; then
            echo "::error::가리킬 주소(notice_url)나 글 번호(notice_to) 중 하나는 적어주세요"; exit 1
          fi
          apply=''
          case "$IN_MODE" in *실제\ 적용*) apply='--apply' ;; esac
          node src/wordpress/add-notice.mjs $IN_IDS $apply \
            ${IN_TEXT:+--text="$IN_TEXT"} ${IN_URL:+--url="$IN_URL"} ${IN_TO:+--to="$IN_TO"} \
            2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 파일로 올리기
        # 이미 만들어 둔 .md 를 워드프레스 **임시글**로 저장한다.
        # AI 를 부르지 않는다 — 글은 이미 있고, 이미지도 OPENAI_API_KEY 가
        # 없으면 로컬에서 텍스트 카드로 그린다(sharp). 그래서 비용이 0원이다.
        #
        # 그 텍스트 카드에 한글을 그리려면 폰트가 필요해서, 이 모드는
        # 0원이지만 폰트 설치 단계를 거친다 (위 조건에 따로 더해 뒀다).
        if: ${{ contains(inputs.mode, '파일로 올리기') }}
        working-directory: sports-news
        env:
          IN_FILE_PATH: ${{ inputs.file_path }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          if [ -z "$IN_FILE_PATH" ]; then
            echo "::error::올릴 글 파일 경로를 적어주세요 (예: 블로그초안/05-페이드캠-중고거래-사진-정리.md)"
            exit 1
          fi
          # 리포 루트 기준 경로도 받는다. sports-news 안이 아니어도 된다.
          target="$IN_FILE_PATH"
          if [ ! -f "$target" ] && [ -f "../$IN_FILE_PATH" ]; then
            target="../$IN_FILE_PATH"
          fi
          if [ ! -f "$target" ]; then
            echo "::error::파일을 찾을 수 없습니다: $IN_FILE_PATH"
            exit 1
          fi
          node src/wordpress/from-file.mjs "$target" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 구글 색인에 다시 들여보내기
        # 걸어 둔 googlebot noindex 깃발을 내린다.
        #
        # 2026-10-10 운영자 지시: "끝난 글도 좋다 다시 파악해서 재구성한뒤
        # 수정한다. 뭐 과거를 찾는 사람도 있으니까"
        #
        # 애초에 뺀 근거가 틀렸던 것도 있다 — 구글 문서는 "콘텐츠 길이 자체는
        # 순위 결정과 관련 없습니다", "중복 콘텐츠는 ... 직접 조치가 부과되지는
        # 않습니다" 라고 적어 두었다. 짧다는 이유로 뺄 근거가 없었다.
        #
        # 네이버에는 애초에 아무 말도 하지 않았으므로 이 단계도 네이버와 무관하다.
        if: ${{ contains(inputs.mode, '다시 들여보내기') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          how='--undo'
          case "$IN_MODE" in
            *실제\ 적용*) how='--undo --apply' ;;
          esac
          node src/wordpress/noindex.mjs $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 시설 글 제목 다시 맞추기
        # 시설 글의 제목과 대표 키워드를 검색되는 형태로 다시 맞춘다.
        # 본문·슬러그·발행상태는 보내지 않는다. 새 정보를 지어내지 않고,
        # 지금 제목에 있는 말만 다시 배열한다.
        if: ${{ contains(inputs.mode, '시설 글 제목') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          how=''
          case "$IN_MODE" in
            *실제\ 적용*) how='--apply' ;;
          esac
          node src/wordpress/facility-retitle.mjs $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 볼링 글 제목 다시 맞추기
        # 볼링 글의 괄호 안이 전부 "… 총정리!" 로 같아서 검색엔진이 개별
        # 글을 못 고르고 카테고리 페이지를 띄웠다. 괄호 안만 본문에서 찾은
        # 장소·기간·상금으로 바꾼다. 괄호 앞(연도·대회명)·본문·슬러그는
        # 보내지 않고, 본문에서 못 찾은 것은 지어내지 않고 건너뛴다.
        if: ${{ contains(inputs.mode, '볼링 글 제목') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          how=''
          case "$IN_MODE" in
            *실제\ 적용*) how='--apply' ;;
          esac
          node src/wordpress/bowling-retitle.mjs $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: AI 인용 기준 지키는지 세기
        # sports-news/CLAUDE.md 3절과 config/style-warp.md ①⑨절의 기준을
        # 706편이 실제로 지키는지 센다. 읽기만 하고 아무것도 바꾸지 않는다.
        if: ${{ contains(inputs.mode, 'AI 인용 기준') }}
        working-directory: sports-news
        env:
          IN_POST_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          # 글 번호를 적으면 그 글의 흔들린 문장을 그대로 보여준다.
          # 비우면 706편 전체를 센다. 어느 쪽이든 아무것도 바꾸지 않는다.
          if [ -n "$IN_POST_IDS" ]; then
            node src/wordpress/ai-cite-scan.mjs --문장 "$IN_POST_IDS" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          else
            node src/wordpress/ai-cite-scan.mjs --보기 20 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          fi
          exit "${PIPESTATUS[0]}"

      - name: 흔들리는 말 걷어내기
        # "지난주"·"이번 주" 처럼 읽는 시점에 따라 달라지는 말을 걷어낸다.
        # **날짜를 지어내지 않는다** — 떼도 뜻이 남는 말만 손댄다.
        # '지난해'·'올해'·'내년'·'다음 주'는 건드리지 않는다.
        # 본문만 보내고, 표에 적힌 것 말고 다른 것이 바뀌면 저장하지 않는다.
        if: ${{ contains(inputs.mode, '흔들리는 말') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_POST_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          how=''
          case "$IN_MODE" in
            *실제\ 적용*) how='--apply' ;;
          esac
          # 글 번호를 비우면 발행 글 전체를 본다.
          node src/wordpress/fix-drift.mjs $how $IN_POST_IDS 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 대표 키워드와 첫 문장 보기
        # ③(대표 키워드가 첫 문장에 있다)을 어긴 글의 키워드와 첫 문장을
        # 나란히 찍는다. 고치는 길이 두 가지라(첫 문장을 다시 쓰기 /
        # 키워드를 바꾸기) 실물을 보고 정해야 한다. 읽기만 한다.
        if: ${{ contains(inputs.mode, '첫 문장 보기') }}
        working-directory: sports-news
        env:
          IN_POST_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          node src/wordpress/ai-cite-scan.mjs --첫문장 "$IN_POST_IDS" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 인사말로 연 글 보기
        # ①(인사말로 열지 않는다)을 어긴 글의 **첫 문단을 통째로** 찍는다.
        # 인사말이 문장 하나면 떼면 끝이지만, 그것이 주제를 말하는 유일한
        # 문장이면 떼면 글이 뜬금없이 시작한다. 읽기만 한다.
        if: ${{ contains(inputs.mode, '인사말로 연 글') }}
        working-directory: sports-news
        env:
          IN_POST_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          node src/wordpress/ai-cite-scan.mjs --인사말 "$IN_POST_IDS" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 인사말 걷어내기
        # 글 맨 앞 인사말 **한 문장만** 뗀다. "오늘은 ○○를 소개할게요" 는
        # 주제를 말하는 문장이라 그대로 두고 그것이 리드가 된다.
        # '안녕하세요'·'반갑습니다' 로 시작할 때만 뗀다 — 세는 기준
        # (ai-cite-scan)보다 좁다. 본문만 보내고, 인사말 말고 다른 것이
        # 바뀌면 저장하지 않는다.
        if: ${{ contains(inputs.mode, '인사말 걷어내기') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_POST_IDS: ${{ inputs.post_ids }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          how=''
          case "$IN_MODE" in
            *실제\ 적용*) how='--apply' ;;
          esac
          node src/wordpress/fix-greeting.mjs $how $IN_POST_IDS 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 첫 문장을 결론으로 다시 쓰기
        # ①(예고로 시작)·②(지시어로 시작)·③(키워드 없음)이 같은 문장에서
        # 만난다. 첫 문장을 "키워드가 든 결론 한 줄"로 바꿔 한 번에 푼다.
        #
        # ⚠️ **돈이 드는 모드다.** 다만 글을 새로 쓰는 것과 다르다 —
        # 웹검색 0회, Haiku, 입력은 그 글 본문 앞부분뿐, 출력은 한 문장.
        # 끝나면 실측 사용량을 찍는다(추정값을 보고하지 않는다).
        #
        # 원문에 없는 숫자가 들어오면 버리고 원래 문장을 그대로 둔다.
        # count 로 한 번에 볼 글 수를 정한다(기본 10편).
        if: ${{ contains(inputs.mode, '첫 문장을 결론으로') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_POST_IDS: ${{ inputs.post_ids }}
          IN_COUNT: ${{ inputs.count }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          how=''
          case "$IN_MODE" in
            *실제\ 적용*) how='--apply' ;;
          esac
          n=10
          case "$IN_COUNT" in
            ''|*[!0-9]*) ;;
            *) [ "$IN_COUNT" -gt 1 ] && n="$IN_COUNT" ;;
          esac
          node src/wordpress/fix-lead.mjs $how --한번에 "$n" $IN_POST_IDS 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 자주 묻는 질문 절 넣기
        # 708편 중 631편에 이 절이 없다. style-warp.md ⑨ 가 "AI 가 인용하기
        # 가장 좋은 형태"라고 적어 둔 자리다.
        #
        # ⚠️ **돈이 드는 모드다.** 웹검색 0회, Haiku, 입력은 그 글 본문,
        # 출력은 질문 넷. 끝나면 실측 사용량을 찍는다.
        #
        # 가장 큰 위험은 비용이 아니라 **똑같은 질문 631벌**이다. 질문을
        # 그 글의 사실에서 뽑고, 앞선 글과 묶음이 같으면 버린다.
        # 답의 숫자가 본문에 없으면 그것도 버린다.
        if: ${{ contains(inputs.mode, '자주 묻는 질문 절 넣기') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_POST_IDS: ${{ inputs.post_ids }}
          IN_COUNT: ${{ inputs.count }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          how=''
          case "$IN_MODE" in
            *실제\ 적용*) how='--apply' ;;
          esac
          n=10
          case "$IN_COUNT" in
            ''|*[!0-9]*) ;;
            *) [ "$IN_COUNT" -gt 1 ] && n="$IN_COUNT" ;;
          esac
          node src/wordpress/add-faq.mjs $how --한번에 "$n" $IN_POST_IDS 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 글끼리 링크 걸기
        # 본문 끝에 "같이 읽을 글" 블록을 붙인다. 기존 본문은 고치지 않는다.
        # 구글 문서: "Google은 주로 이미 크롤링한 다른 페이지의 링크를 통해
        # 페이지를 찾습니다." 발행 633편 중 서치콘솔이 아는 건 156편뿐이다.
        if: ${{ contains(inputs.mode, '글끼리 링크') }}
        working-directory: sports-news
        env:
          IN_MODE: ${{ inputs.mode }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
        run: |
          how=''
          case "$IN_MODE" in
            # '다시 맞추기': 이미 블록이 있는 글도 새 목록으로 갈아 끼운다.
            # 새 글을 발행한 뒤에 쓴다 — 그래야 **기존 글 → 새 글** 방향
            # 링크가 생긴다. 구글이 새 글을 찾는 경로가 그것이다.
            #
            # 633편을 다 읽지만 **쓰는 것은 목록이 실제로 바뀐 글뿐이다**
            # (바뀔 것이 없으면 저장하지 않는다).
            *다시\ 맞추기*) how='--apply --다시' ;;
            *실제\ 적용*) how='--apply' ;;
          esac
          node src/wordpress/internal-links.mjs $how 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 실행
        # 사이트 조사만 고르거나 손보기만 할 때는 여기를 건너뛴다. AI를 한 번도 부르지 않으므로
        # 비용이 0원이다. 설정이 제대로 됐는지 확인할 때 쓴다.
        if: ${{ !contains(inputs.mode, '사이트 조사만') && !contains(inputs.mode, 'SEO 손보기') && !contains(inputs.mode, '링크 현재창으로') && !contains(inputs.mode, '글 찾기') && !contains(inputs.mode, '메타 설명') && !contains(inputs.mode, '이미지 설명') && !contains(inputs.mode, '분류 설명') && !contains(inputs.mode, '상금 제목') && !contains(inputs.mode, '제목·설명 고치기') && !contains(inputs.mode, '중계 배너') && !contains(inputs.mode, '홈페이지 배너') && !contains(inputs.mode, '광고가 페이지에') && !contains(inputs.mode, '색인이 안 되는 이유') && !contains(inputs.mode, '겹치는 글 전부') && !contains(inputs.mode, '보강 1순위') && !contains(inputs.mode, '섞인 이름') && !contains(inputs.mode, '용접된 문단') && !contains(inputs.mode, 'alt 둘') && !contains(inputs.mode, '무엇이 모자란지') && !contains(inputs.mode, '같은 대회 짝') && !contains(inputs.mode, '안내 여러 쌍에') && !contains(inputs.mode, '글 본문 보기') && !contains(inputs.mode, '카드 이미지 다시 굽기') && !contains(inputs.mode, '색인에서 빼기') && !contains(inputs.mode, '다시 들여보내기') && !contains(inputs.mode, '시설 글 제목') && !contains(inputs.mode, '볼링 글 제목') && !contains(inputs.mode, 'AI 인용 기준') && !contains(inputs.mode, '흔들리는 말') && !contains(inputs.mode, '첫 문장 보기') && !contains(inputs.mode, '인사말로 연 글') && !contains(inputs.mode, '인사말 걷어내기') && !contains(inputs.mode, '첫 문장을 결론으로') && !contains(inputs.mode, '자주 묻는 질문 절 넣기') && !contains(inputs.mode, '글끼리 링크') && !contains(inputs.mode, '오타') && !contains(inputs.mode, '휴지통') && !contains(inputs.mode, '임시글 발행') && !contains(inputs.mode, '우리 미디어에 올리기') && !contains(inputs.mode, '깨진 링크') && !contains(inputs.mode, '깨진 표') && !contains(inputs.mode, '글자로 남은 링크') && !contains(inputs.mode, '누를 수 없는 주소') && !contains(inputs.mode, '적힌 주소를 링크로') && !contains(inputs.mode, '하단 고정 바') && !contains(inputs.mode, '본문 쿠팡 상품') && !contains(inputs.mode, '광고 아래 여백') && !contains(inputs.mode, '돌려주기') && !contains(inputs.mode, '사이트맵') && !contains(inputs.mode, '쿠팡 광고를') && !contains(inputs.mode, '소제목 섹션 빼기') && !contains(inputs.mode, '섹션 끼워넣기') && !contains(inputs.mode, '섹션 내용 갈아끼우기') && !contains(inputs.mode, '올해 글 안내') && !contains(inputs.mode, '글감 후보') && !contains(inputs.mode, '공식 페이지') && !contains(inputs.mode, '파일로 올리기') }}
        working-directory: sports-news
        env:
          IN_SUBJECT: ${{ inputs.subject }}
          IN_TOPIC: ${{ inputs.topic }}
          IN_MODE: ${{ inputs.mode }}
          IN_COUNT: ${{ inputs.count }}
          IN_ARTICLE: ${{ inputs.article_text }}
          IN_RESEARCH: ${{ contains(inputs.mode, '공식 자료 조사') }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          WORDPRESS_USER_AGENT: ${{ secrets.WORDPRESS_USER_AGENT }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_AD_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_AD_SECRET: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
        run: |
          # 입력값을 명령줄에 직접 끼워 넣지 않는다.
          # GitHub 표현식을 run 블록에 바로 쓰면 입력에 들어간 셸 문자가
          # 그대로 실행되므로, 위 env로 넘겨받아 배열로 조립한다.
          args=()
          case "$IN_COUNT" in
            ''|*[!0-9]*) echo "::error::글 개수는 숫자여야 합니다: $IN_COUNT"; exit 1 ;;
          esac
          if [ -n "$IN_SUBJECT" ]; then
            # 주제를 적었으면 그것만 쓴다. 종목 목록은 돌지 않는다.
            args+=("--subject=$IN_SUBJECT" "--limit=$IN_COUNT")
            echo "주제 지정: $IN_SUBJECT (1편만 만듭니다)"
            # 종목도 함께 적었으면 넘긴다. 분류기보다 사람이 낫다 —
            # 2026-10-19 에 BNP 파리바 오픈(테니스)을 골프로 분류했다.
            if [ -n "$IN_TOPIC" ]; then
              args+=("--topic=$IN_TOPIC")
              echo "  종목을 적어 주셨으니 그것을 씁니다: $IN_TOPIC"
            fi
            # 기사 본문을 붙여넣었으면 그걸 재료로 쓴다. 뉴스 수집을 안 거친다.
            # 주제 한 줄만 넘기면 기사에 있는 숫자가 전달되지 않아, 사실 확인
            # 단계가 "확인할 수 없다"며 글을 못 쓴다(2026-10-05 에 실제로 그랬다).
            if [ -n "$IN_ARTICLE" ]; then
              printf '%s' "$IN_ARTICLE" > "$RUNNER_TEMP/given-article.txt"
              args+=("--article=$RUNNER_TEMP/given-article.txt")
              echo "  붙여넣은 기사를 재료로 씁니다 ($(wc -c < "$RUNNER_TEMP/given-article.txt")바이트)"
            # 공식 자료 조사 방식이면 뉴스를 아예 안 거친다.
            # 요금·예약·주차처럼 뉴스에 없는 정보를 쓸 때 쓴다.
            elif [ "$IN_RESEARCH" = "true" ]; then
              args+=("--research")
              echo "  뉴스 없이 공식 자료(관공서·협회·공식 홈페이지)로 조사합니다"
            fi
          elif [ -n "$IN_TOPIC" ]; then
            args+=("--topic=$IN_TOPIC" "--limit=$IN_COUNT")
          else
            # 종목을 안 고르면 전 종목을 훑어 가장 좋은 글감만 쓴다.
            # 수집은 공짜라 넓게 보고, 돈이 드는 작성은 좁게 한다.
            args+=("--best=$IN_COUNT")
            echo "전 종목에서 가장 좋은 글감 $IN_COUNT편을 고릅니다"
          fi
          case "$IN_MODE" in
            *draft*)
              args+=("--draft")
              echo "임시글로 저장합니다 (상태: draft — 발행되지 않습니다)" ;;
            *)
              echo "미리보기입니다. 워드프레스에 저장하지 않습니다." ;;
          esac
          node src/main.mjs "${args[@]}" 2>&1 | tee -a "$RUNNER_TEMP/sn.log"
          exit "${PIPESTATUS[0]}"

      - name: 결과물 올리기 (본문·SEO 값)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sports-news-drafts-${{ github.run_number }}
          path: |
            sports-news/out/
            logs/
          if-no-files-found: ignore
          retention-days: 30


      - name: 도구가 찍은 것 다시 보기 (로그 맨 끝)
        # **왜 이 단계가 있나** (2026-10-19)
        #
        # 깃허브 잡 로그를 꼬리부터 읽는데, 바로 앞의 아티팩트 업로드 단계가
        # 수십 줄을 쏟아내서 **정작 도구가 찍은 결과가 꼬리 밖으로 밀려났다.**
        # 2026-10-18 하루에만 여섯 번 넘게 "run 은 성공했는데 몇 편이
        # 바뀌었는지는 못 읽었다"로 끝났다.
        #
        # 그래서 각 도구의 출력을 $RUNNER_TEMP/sn.log 에 함께 남기고,
        # **잡의 맨 마지막 단계**에서 그것을 다시 찍는다. 꼬리부터 읽으면
        # 언제나 이 줄들이 먼저 걸린다.
        # ⚠️ 입력값은 **env 로만** 넘긴다. run 블록에 표현식으로 직접
        #    끼우면 셸 주입이 된다 — 검사(workflow-syntax)가 막아 줬다.
        #    주석에도 표현식 괄호를 적지 않는다. 검사가 그것까지 읽는다.
        #
        # ⚠️ env 를 `if: always()` **앞에** 둔다. 검사가 "if: always() 다음
        #    줄이 run" 인지를 글자로 보기 때문이다. YAML 은 키 순서가
        #    자유로우니 **검사를 느슨하게 풀지 않고** 이쪽을 맞춘다 —
        #    그 검사가 지키는 것(요약이 실패해도 돈다)은 그대로 값이 있다.
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_IDS: ${{ inputs.post_ids }}
          IN_FILE: ${{ inputs.file_path }}
          IN_TITLE: ${{ inputs.new_title }}
        if: always()
        run: |
          echo "════════ 도구 출력 요약 ════════"
          if [ -f "$RUNNER_TEMP/sn.log" ]; then
            # ⚠️ 60 줄이었다가 200 으로 늘렸다 (2026-11-09).
            #
            #    '색인이 안 되는 이유 찾기' 를 돌렸는데 ④⑤⑥ 만 보이고
            #    **①②③ 이 잘렸다.** 효성님이 물어본 "noindex 몇 편인지" 가
            #    ② 에 있었다. ⑤ 의 목록만 27 줄이라 앞쪽을 밀어낸 것이다.
            #
            #    이 단계가 있는 이유가 "결과를 읽을 수 있게" 인데, 정작
            #    물어본 숫자를 제 손으로 가렸다. 도구 쪽 출력 순서를
            #    건드리는 것보다 여기를 늘리는 쪽이 좁은 수선이다.
            tail -200 "$RUNNER_TEMP/sn.log"
          else
            # **왜 죽었는지를 여기서 말해 준다** (2026-11-09)
            #
            # 전에는 "(도구가 아무것도 찍지 않았습니다)" 한 줄로 끝났다.
            # 오늘 그 줄만 보고 멈춘 적이 두 번이다.
            #   run 979  '사이트 조사' 가 호스트 403 으로 죽어 뒤 단계가 전부 skipped
            #   run 997  file_path 를 잘못 적어 입력 검사에서 멈춤
            # 둘 다 이유가 로그 **앞쪽**에 있었고, 꼬리부터 읽는 사람에게는
            # 보이지 않았다. 요약이 "모르겠다"로 끝나면 run 을 한 번 더
            # 돌려야 안다.
            echo "(도구가 아무것도 찍지 않았습니다 — 도구 단계 전에 멈췄다는 뜻입니다)"
            echo ""
            echo "── 멈춘 자리를 찾습니다 ──"
            # 입력 검사·단계 실패가 남긴 주석(::error::)을 잡의 로그에서는
            # 볼 수 없으므로, 적어도 **무엇을 받았는지**를 되짚어 준다.
            echo "  모드      : $IN_MODE"
            echo "  글 번호   : $IN_IDS"
            echo "  파일 경로 : $IN_FILE"
            echo "  기준 소제목: $IN_TITLE"
            echo ""
            echo "  흔한 이유 셋"
            echo "   1. 파일 경로를 잘못 적었다 (섹션초안/… 이름이 한 글자 다른 경우가 많다)"
            echo "   2. 그 모드가 요구하는 입력을 비웠다 (글 번호·파일·소제목)"
            echo "   3. 워드프레스가 러너 IP 를 막았다 (403). 조금 뒤 다시 돌리면 된다"
            echo ""
            echo "  위쪽 단계 로그에서 ::error:: 또는 botBlocked 를 찾으세요."
          fi
          echo "════════ 요약 끝 ════════"
