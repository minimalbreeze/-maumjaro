name: AI 서프라이즈 소재·대본·영상 만들기

# 왜 여기서 도는가
#   PC에 Node를 깔거나 터미널을 열 필요 없이 GitHub 화면에서 버튼만 누르면
#   된다. sports-news.yml 과 같은 방식이다.
#
# 안전장치
#   - 기본값은 "테스트만"이다. 실수로 눌러도 돈이 들지 않는다.
#   - 유튜브에 아무것도 올리지 않는다. Phase 1에는 업로드 코드가 아예 없다.
#   - 1차 기록이 확인되고 출처가 2개 이상인 소재만 대본을 쓴다.
#     검토가 필요한 소재는 목록으로만 남고 대본을 쓰지 않는다.
#   - 자동 실행(cron)을 걸지 않았다. 사람이 누를 때만 돈다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '무엇을 할까요'
        required: true
        default: '테스트만 (비용 0원 · 처음엔 이걸로)'
        type: choice
        options:
          - '테스트만 (비용 0원 · 처음엔 이걸로)'
          - '소리 점검만 (TTS 키가 되는지 · 비용 0원)'
          - '목소리 들어보기 (같은 문장을 여러 목소리로 · 약 $0.05)'
          - '대본만 다시 쓰기 (이어하기 번호 필요 · 약 $0.5)'
          - '소재만 찾기 (대본 안 씀)'
          - '소재 찾고 대본까지 쓰기'
          - '소재 → 대본 → 장면까지 쓰기'
          - '소재 → 대본 → 장면 → 영상·쇼츠까지 만들기'
          - '진짜 그림까지 (이미지 생성 · 장당 돈이 나갑니다)'
          - '완성본 (그림 + 목소리 + 배경음악)'
          - '올릴 거리만 만들기 (제목·썸네일·설명문 · 이어하기 번호 필요 · 약 $0.1)'
          - '이상한 동화 — 대본만 (기획 파일 필요 · 약 $0.5)'
          - '이상한 동화 — 완성본 (그림 + 목소리 + 영상 · 약 $0.7)'
          - '스포츠 분석 — 대본 검사만 (대본 파일 필요 · 비용 0원)'
          - '스포츠 분석 — 완성본 (그림 + 목소리 + 영상 · 약 $0.6)'
          - '화풍 미리보기 (그림 6장만 · 약 $0.1)'
      resume_run:
        description: '이어하기 — 앞 실행 번호 (예: 11). 그 실행의 결과를 받아 남은 것만 만듭니다. 비우면 새로 시작'
        required: false
        default: ''
      tale_plan:
        description: '이상한 동화 기획 파일 (예: 이상한동화/1화.json). 동화 방식에서만 씁니다'
        required: false
        default: '이상한동화/1화.json'
      tale_script:
        description: '이미 써 둔 동화 대본 파일. 넣으면 AI가 다시 쓰지 않습니다 (비용 0원). 비우면 AI가 씁니다'
        required: false
        default: '이상한동화/1화-대본.md'
      sports_plan:
        description: '스포츠 기획 파일 (예: 스포츠영상/1화.json). 스포츠 방식에서만 씁니다'
        required: false
        default: '스포츠영상/1화.json'
      sports_script:
        description: '스포츠 대본 파일. 스포츠는 **반드시** 사람이 쓴 대본이 있어야 합니다 (사실을 AI가 지어내면 안 되므로)'
        required: false
        default: '스포츠영상/1화-대본.md'
      topic:
        description: '소재를 직접 지정 (예: 플래넌 제도 등대지기 실종). 비우면 AI가 찾습니다'
        required: false
        default: ''
      legend:
        description: '전설·괴담 추적 편 (사건 기록이 없는 이야기. 출처를 쫓습니다). 소재 지정 필요'
        required: false
        default: false
        type: boolean
      video_ratio:
        description: 'AI 영상 비중 (0.15 = 샷의 15%만 영상. 올리면 비싸집니다)'
        required: false
        default: '0.15'
      count:
        description: '찾을 소재 수'
        required: false
        default: '5'
      scripts:
        description: '쓸 대본 수 (점수 높은 순. 대본까지 쓰기에서만 씁니다)'
        required: false
        default: '1'
      minutes:
        description: '영상 길이 (분)'
        required: false
        default: '8'
      tts_voice:
        description: '목소리 (비우면 ko-KR-Neural2-C). 목록은 voice --voices 로 봅니다'
        required: false
        default: ''
      image_model:
        description: '이미지 모델 (schnell = 싸고 빠름 / dev = 비싸고 정확함)'
        required: false
        default: 'schnell'
        type: choice
        options:
          - 'schnell'
          - 'dev'
      max_usd:
        description: '이미지에 쓸 돈 상한 (달러). 넘으면 멈춥니다'
        required: false
        default: '3'
      category:
        description: '분야 (비우면 알아서 섞습니다). 예: 과학적 미스터리'
        required: false
        default: ''

# 리포에 아무것도 쓰지 않는다. 읽기 권한이면 충분하다.
permissions:
  contents: read
  # 이어하기가 앞 실행의 Artifacts 를 내려받는다. 리포에는 아무것도 쓰지 않는다.
  actions: read

concurrency:
  group: ai-surprise
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 멈춘 단계를 한나절 돌게 두지 않는다. 기본값은 6시간이다.
    # 완성본이 가장 오래 걸리는데 실측 20분이었으므로 90분이면 넉넉하다.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-surprise/package-lock.json

      - name: 설치
        working-directory: ai-surprise
        run: npm ci

      # 자체 검사는 어느 방식이든 먼저 돈다. 몇 초면 끝나고 돈이 안 든다.
      # 코드가 깨진 상태로 AI를 부르면 돈만 쓰고 결과가 안 나온다.
      - name: 자체 검사
        working-directory: ai-surprise
        run: npm test

      # 앞 실행에서 돈 주고 산 것(대본·장면·그림·음성)을 되돌려 놓는다.
      # 서버는 실행마다 새로 만들어지므로, 이것이 없으면 처음부터 다시 산다.
      # 효성님이 보는 번호는 "실행 #11"인데, 내려받기에 필요한 것은 그것이
      # 아니라 실행마다 붙는 긴 내부 번호다. 사람에게 그걸 찾아오라고 하지
      # 않고 여기서 번호로 찾는다.
      - name: 앞 실행 찾기
        if: ${{ inputs.resume_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.resume_run }}
        run: |
          case "$WANT" in
            ''|*[!0-9]*) echo "::error::이어할 실행 번호는 숫자여야 합니다: $WANT"; exit 1 ;;
          esac
          run_id=$(gh api "repos/${{ github.repository }}/actions/workflows/ai-surprise.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.run_number == $WANT) | .id" | head -1)
          if [ -z "$run_id" ]; then
            echo "::error::실행 #$WANT 을 찾을 수 없습니다. Actions 목록에서 번호를 확인해 주세요."
            exit 1
          fi
          echo "실행 #$WANT = $run_id"
          echo "RESUME_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: 앞 실행의 결과물 받아오기
        if: ${{ inputs.resume_run != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ai-surprise-${{ inputs.resume_run }}
          run-id: ${{ env.RESUME_RUN_ID }}
          github-token: ${{ github.token }}
          path: ai-surprise

      - name: 받아온 것 확인
        if: ${{ inputs.resume_run != '' }}
        working-directory: ai-surprise
        run: |
          shopt -s nullglob
          found=''
          for f in content/*/script.md; do found="${f%/script.md}"; found="${found#content/}"; break; done
          if [ -z "$found" ]; then
            echo "::error::받아온 결과물에 대본이 없습니다. 실행 번호를 확인해 주세요: ${{ inputs.resume_run }}"
            exit 1
          fi
          echo "RESUME_ID=$found" >> "$GITHUB_ENV"
          echo "이어할 편: content/$found"
          echo "  장면    $( [ -f "content/$found/scenes.json" ] && echo 있음 || echo 없음 )"
          echo "  그림    $(ls "content/$found/assets"/*.png 2>/dev/null | wc -l) 장"
          echo "  음성    $( [ -f "content/$found/audio/voice.mp3" ] && echo 있음 || echo 없음 )"
          echo "이미 있는 것은 다시 사지 않습니다."

      - name: 비밀값이 등록되어 있는지 확인
        if: ${{ !contains(inputs.mode, '테스트만') && !contains(inputs.mode, '소리 점검') && !contains(inputs.mode, '목소리 들어보기') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY 가 등록되지 않았습니다."
            echo "리포 Settings → Secrets and variables → Actions → New repository secret 에서 추가하세요."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY 등록되어 있습니다. (값은 출력하지 않습니다)"

      - name: 목소리 키가 등록되어 있는지 확인
        if: ${{ contains(inputs.mode, '완성본') || contains(inputs.mode, '소리 점검') || contains(inputs.mode, '목소리 들어보기') }}
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          if [ -z "$GOOGLE_TTS_API_KEY" ]; then
            echo "::error::GOOGLE_TTS_API_KEY 가 등록되지 않았습니다."
            echo "console.cloud.google.com 에서 프로젝트를 만들고 Cloud Text-to-Speech API 를"
            echo "사용 설정한 뒤, API 키를 만들어 리포 Settings → Secrets 에 추가하세요."
            exit 1
          fi
          echo "GOOGLE_TTS_API_KEY 등록되어 있습니다. (값은 출력하지 않습니다)"

      - name: 이미지 토큰이 등록되어 있는지 확인
        if: ${{ contains(inputs.mode, '그림') || contains(inputs.mode, '완성본') || contains(inputs.mode, '미리보기') }}
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          if [ -z "$REPLICATE_API_TOKEN" ]; then
            echo "::error::REPLICATE_API_TOKEN 이 등록되지 않았습니다."
            echo "https://replicate.com/account/api-tokens 에서 토큰을 만들고,"
            echo "리포 Settings → Secrets and variables → Actions → New repository secret 에 추가하세요."
            exit 1
          fi
          echo "REPLICATE_API_TOKEN 등록되어 있습니다. (값은 출력하지 않습니다)"

      # 영상을 만들 때만 깐다. 다른 방식에서는 1분 넘게 기다릴 이유가 없다.
      # fonts-noto-cjk 가 없으면 자막의 한글이 전부 네모로 나온다 —
      # 그런데 ffmpeg는 오류를 내지 않으므로, 영상을 눈으로 보기 전까지
      # 모른다. 그래서 깐 다음 실제로 글자가 그려지는지 확인한다.
      - name: ffmpeg와 한글 글꼴 설치
        # 동화 완성본도 이름에 '완성본' 이 들어 있어 여기 걸린다. 동화 대본만
        # 만드는 방식에는 ffmpeg 가 필요 없으므로 따로 넣지 않는다.
        #
        # '화풍 미리보기' 는 이름에 '그림' 이 들어 있어 여기 걸렸다. 그런데
        # 그 방식은 그림 6장을 받아 저장할 뿐이라 ffmpeg 를 한 번도 부르지
        # 않는다. 실행 #30 이 필요하지도 않은 설치에 6분을 쓰고 죽었다 —
        # 싸게 보려고 만든 길이 설치 때문에 막힌 셈이다. 빼 둔다.
        # (라우팅에서도 '그림' 때문에 같은 함정에 걸렸었다. 모드 이름에
        #  들어간 낱말로 분기할 때는 늘 이쪽을 먼저 확인한다.)
        if: ${{ (contains(inputs.mode, '영상') || contains(inputs.mode, '그림') || contains(inputs.mode, '완성본') || contains(inputs.mode, '올릴 거리')) && !contains(inputs.mode, '미리보기') }}
        # 실측 24초인 단계다. 그런데 패키지 서버가 응답하지 않는 일이
        # 반복됐다 — 실행 #25 와 #26 이 **연달아** 여기서 10분을 꽉 채우고
        # 죽었다. 그대로 두면 6시간을 도므로 시간제한은 유지하되 6분으로
        # 줄인다. 빨리 죽고 다시 도는 쪽이 낫다.
        timeout-minutes: 6
        run: |
          set -u
          # 1) 이미 있는 것은 깔지 않는다.
          #
          # GitHub 러너 이미지에는 ffmpeg 가 들어 있을 때가 많다. 그런데도
          # 매번 apt 를 부르느라 패키지 서버에 매달렸다. 필요한 것만 추린다.
          need=""
          command -v ffmpeg >/dev/null 2>&1 || need="$need ffmpeg"
          fc-list 2>/dev/null | grep -qi "noto sans cjk" || need="$need fonts-noto-cjk"

          if [ -z "$need" ]; then
            echo "ffmpeg 와 한글 글꼴이 이미 있습니다. 설치를 건너뜁니다."
          else
            echo "깔아야 할 것:$need"
            # 2) update 없이 먼저 해 본다.
            #
            # 멈추는 쪽은 대개 apt-get update 다(미러 목록을 전부 긁는다).
            # 러너 이미지의 apt 캐시가 최신이면 update 없이도 깔린다.
            # 재시도 횟수를 주어 한 미러가 느려도 넘어가게 한다.
            APT="sudo apt-get -o Acquire::Retries=3 -o Dpkg::Use-Pty=0"
            if ! $APT install -y -qq --no-install-recommends $need; then
              echo "캐시로 안 되어 목록을 새로 받습니다."
              $APT update -qq
              $APT install -y -qq --no-install-recommends $need
            fi
          fi

          # 3) 어떤 길로 왔든 실제로 쓸 수 있는지 확인한다.
          #
          # 글꼴이 없으면 ffmpeg 는 오류를 내지 않고 **네모를 그린다.**
          # 영상을 눈으로 보기 전까지 모르므로 여기서 막는다.
          ffmpeg -hide_banner -version | head -1
          fc-list | grep -ci "noto sans cjk" || {
            echo "::error::한글 글꼴이 설치되지 않았습니다. 자막이 네모로 나옵니다."
            exit 1
          }

      - name: 실행
        if: ${{ !contains(inputs.mode, '테스트만') }}
        working-directory: ai-surprise
        env:
          # 입력값을 명령줄에 직접 끼워 넣지 않는다.
          # GitHub 표현식을 run 블록에 바로 쓰면 입력에 들어간 셸 문자가
          # 그대로 실행되므로, env로 넘겨받아 배열로 조립한다.
          IN_MODE: ${{ inputs.mode }}
          IN_COUNT: ${{ inputs.count }}
          IN_SCRIPTS: ${{ inputs.scripts }}
          IN_MINUTES: ${{ inputs.minutes }}
          IN_CATEGORY: ${{ inputs.category }}
          IN_TOPIC: ${{ inputs.topic }}
          IN_TALE_PLAN: ${{ inputs.tale_plan }}
          IN_TALE_SCRIPT: ${{ inputs.tale_script }}
          IN_SPORTS_PLAN: ${{ inputs.sports_plan }}
          IN_SPORTS_SCRIPT: ${{ inputs.sports_script }}
          IN_LEGEND: ${{ inputs.legend }}
          IN_VIDEO_RATIO: ${{ inputs.video_ratio }}
          IN_IMAGE_MODEL: ${{ inputs.image_model }}
          IN_MAX_USD: ${{ inputs.max_usd }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          TTS_VOICE: ${{ inputs.tts_voice }}
          # 장면 단계가 읽는다. 샷 중 몇 %를 AI 영상으로 만들지 정한다.
          VIDEO_SHOT_RATIO: ${{ inputs.video_ratio }}
        run: |
          for pair in "소재 수:$IN_COUNT" "대본 수:$IN_SCRIPTS" "영상 길이:$IN_MINUTES"; do
            label="${pair%%:*}"; value="${pair#*:}"
            case "$value" in
              ''|*[!0-9]*) echo "::error::${label}는 숫자여야 합니다: $value"; exit 1 ;;
            esac
          done
          case "$IN_VIDEO_RATIO" in
            ''|*[!0-9.]*|*.*.*) echo "::error::영상 비중은 0~1 사이 숫자여야 합니다: $IN_VIDEO_RATIO"; exit 1 ;;
          esac

          args=("--count=$IN_COUNT")
          [ -n "$IN_CATEGORY" ] && args+=("--category=$IN_CATEGORY")
          if [ "$IN_LEGEND" = "true" ] && [ -z "$IN_TOPIC" ]; then
            echo "::error::전설 추적 편은 소재를 지정해야 합니다. '소재를 직접 지정' 칸을 채워 주세요."
            exit 1
          fi

          if [ -n "$IN_TOPIC" ]; then
            args+=("--topic=$IN_TOPIC")
            if [ "$IN_LEGEND" = "true" ]; then
              args+=("--legend")
              echo "전설·괴담 추적 편입니다: $IN_TOPIC"
              echo "사건이 일어났는지가 아니라, 이 이야기가 어디서 나와 어떻게 퍼졌는지를 조사합니다."
              echo "대본에 '이 이야기는 어디서 왔나' 섹션이 필수로 들어갑니다."
            fi
            echo "소재를 직접 지정했습니다: $IN_TOPIC"
            echo "AI가 후보를 고르지 않고 이것만 조사합니다. 검증은 그대로 걸립니다 —"
            echo "1차 기록이 없거나 출처가 하나뿐이면 대본을 쓰지 않고 멈춥니다."
          fi

          case "$IN_MAX_USD" in
            ''|*[!0-9.]*|*.*.*) echo "::error::돈 상한은 숫자여야 합니다: $IN_MAX_USD"; exit 1 ;;
          esac

          # 어느 편을 다룰지 정한다. 이어하기면 그 편, 아니면 방금 만든 편.
          # content 아이디는 0으로 채운 숫자라 사전순 마지막이 최신이다.
          pick_id() {
            if [ -n "$RESUME_ID" ]; then echo "$RESUME_ID"; return; fi
            local last=''
            for d in content/*/; do last="${d%/}"; last="${last#content/}"; done
            echo "$last"
          }

          case "$IN_MODE" in
            *'올릴 거리'*)
              if [ -z "$RESUME_ID" ]; then
                echo "::error::'이어하기' 칸에 앞 실행 번호를 넣어 주세요. 그 편의 올릴 거리를 만듭니다."
                exit 1
              fi
              echo "content/$RESUME_ID 의 제목·썸네일·설명문·태그를 만듭니다."
              echo "썸네일은 완성된 영상에서 떼어냅니다. 영상을 새로 만들지 않으므로 렌더링 비용이 없습니다."
              node src/main.mjs upload --id="$RESUME_ID"
              ;;
            *'화풍 미리보기'*)
              # 화풍만 몇 장 뽑는다. 완성본을 돌리지 않으므로 싸고 빠르다.
              # 얼굴이 제대로 나오는지 보려고 만든 길이다.
              node src/main.mjs preview --kind=SPORTS --models=schnell,dev
              ;;
            *'스포츠'*)
              # 동화 분기와 같은 이유로 '완성본'·'그림' 분기보다 앞에 둔다.
              # 모드 이름에 '완성본' 이 들어 있어서 뒤에 두면 실화로 샌다.
              case "$IN_SPORTS_PLAN" in
                ''|*..*) echo "::error::기획 파일 경로가 이상합니다: $IN_SPORTS_PLAN"; exit 1 ;;
              esac
              if [ ! -f "../$IN_SPORTS_PLAN" ]; then
                echo "::error::기획 파일이 없습니다: $IN_SPORTS_PLAN"
                exit 1
              fi
              # 스포츠는 대본이 **없으면 돌리지 않는다.** 날짜·금액·규정은
              # AI 가 그럴듯하게 지어내는데, 한 번 틀리면 보고 들어온 사람이
              # 바로 알아채고 채널 신뢰가 끝난다.
              case "$IN_SPORTS_SCRIPT" in
                ''|*..*) echo "::error::스포츠 편은 사람이 쓴 대본이 반드시 있어야 합니다: $IN_SPORTS_SCRIPT"; exit 1 ;;
              esac
              if [ ! -f "../$IN_SPORTS_SCRIPT" ]; then
                echo "::error::대본 파일이 없습니다: $IN_SPORTS_SCRIPT"
                exit 1
              fi
              echo "스포츠 분석을 만듭니다. 기획: $IN_SPORTS_PLAN / 대본: $IN_SPORTS_SCRIPT"
              echo "대본은 사람이 쓴 것을 그대로 씁니다 — AI 를 부르지 않으므로 대본 비용 0원."

              node src/main.mjs sports --plan="$IN_SPORTS_PLAN" --script="$IN_SPORTS_SCRIPT"
              sports_id="$(pick_id)"
              if [ "${IN_MODE%%완성본*}" != "$IN_MODE" ]; then
                if [ -z "$sports_id" ]; then
                  echo "::error::대본은 올렸는데 편 번호를 못 찾았습니다."
                  exit 1
                fi
                echo "content/$sports_id — 장면·그림·목소리·영상까지 이어서 만듭니다."
                # 배경음악을 끈다. bgm/ 의 여섯 곡은 전부 미스터리·스릴러용이라
                # 야구 분석에 깔면 어긋난다. 동화와 같은 이유다.
                node src/main.mjs auto --resume="$sports_id" \
                  --scenes --images --narrate --video --no-bgm \
                  --image-model="$IN_IMAGE_MODEL" --max-usd="$IN_MAX_USD"
                node src/main.mjs upload --id="$sports_id" \
                  || echo "::warning::올릴 거리 만들기에 실패했습니다. 영상은 그대로 있습니다."
              else
                echo "대본 검사만 했습니다. 통과했으면 완성본으로 돌려 주세요."
              fi
              ;;
            *'동화'*)
              # 이 분기가 '완성본'·'그림' 분기보다 **반드시 앞에** 있어야 한다.
              # 모드 이름에 '완성본' 이 들어 있어서, 뒤에 두면 실화 쪽으로 샌다.
              case "$IN_TALE_PLAN" in
                ''|*..*) echo "::error::기획 파일 경로가 이상합니다: $IN_TALE_PLAN"; exit 1 ;;
              esac
              if [ ! -f "../$IN_TALE_PLAN" ]; then
                echo "::error::기획 파일이 없습니다: $IN_TALE_PLAN"
                echo "리포에 그 파일이 있는지 확인해 주세요."
                exit 1
              fi
              echo "이상한 동화를 만듭니다. 기획 파일: $IN_TALE_PLAN"
              echo "조사 단계가 없습니다 — 창작물이라 찾을 출처가 없습니다."

              tale_args=(--plan="$IN_TALE_PLAN")
              if [ -n "$IN_TALE_SCRIPT" ]; then
                case "$IN_TALE_SCRIPT" in
                  *..*) echo "::error::대본 파일 경로가 이상합니다: $IN_TALE_SCRIPT"; exit 1 ;;
                esac
                if [ ! -f "../$IN_TALE_SCRIPT" ]; then
                  echo "::error::대본 파일이 없습니다: $IN_TALE_SCRIPT"
                  exit 1
                fi
                tale_args+=(--script="$IN_TALE_SCRIPT")
                echo "써 둔 대본을 그대로 씁니다: $IN_TALE_SCRIPT (AI를 부르지 않으므로 비용 0원)"
              else
                echo "대본이 지정되지 않아 AI가 씁니다."
              fi
              node src/main.mjs tale "${tale_args[@]}"
              tale_id="$(pick_id)"
              # case 를 중첩하지 않는다. 안쪽 case 의 기본 분기(*)가 바깥
              # case 의 분기들 사이에 끼어들어 읽기도 검사하기도 어려워진다.
              # 문자열이 들어 있는지만 보면 되므로 파라미터 확장으로 본다.
              if [ "${IN_MODE%%완성본*}" != "$IN_MODE" ]; then
                if [ -z "$tale_id" ]; then
                  echo "::error::대본은 썼는데 편 번호를 못 찾았습니다."
                  exit 1
                fi
                echo "content/$tale_id — 장면·그림·목소리·영상까지 이어서 만듭니다."
                # 배경음악을 끈다. 지금 bgm/ 에 있는 여섯 곡은 전부
                # 미스터리·스릴러용이라 조용한 동화에 깔면 어긋난다.
                # 동화에 맞는 곡을 넣은 뒤에 이 옵션을 떼면 된다.
                node src/main.mjs auto --resume="$tale_id" \
                  --scenes --images --narrate --video --no-bgm \
                  --image-model="$IN_IMAGE_MODEL" --max-usd="$IN_MAX_USD"
                node src/main.mjs upload --id="$tale_id" \
                  || echo "::warning::올릴 거리 만들기에 실패했습니다. 영상은 그대로 있습니다."
              else
                echo "대본까지만 만들었습니다. 읽어보고 괜찮으면 완성본으로 돌려 주세요."
              fi
              ;;
            *'대본만 다시 쓰기'*)
              if [ -z "$RESUME_ID" ]; then
                echo "::error::'이어하기' 칸에 앞 실행 번호를 넣어 주세요. 그 편의 대본을 다시 씁니다."
                exit 1
              fi
              echo "content/$RESUME_ID 의 대본을 지금 규칙으로 다시 씁니다."
              echo "조사 자료는 그대로 쓰므로 조사비가 들지 않습니다. 그림·음성·영상은 만들지 않습니다."
              node src/main.mjs script --id="$RESUME_ID" --minutes="$IN_MINUTES"
              ;;
            *'목소리 들어보기'*)
              echo "같은 문장을 여러 목소리로 만듭니다. 그림도 영상도 만들지 않습니다."
              echo "끝나면 Artifacts 의 content/_목소리 에서 받아 들어 보세요."
              node src/main.mjs voice --sample
              ;;
            *'소리 점검'*)
              # 키가 진짜 되는지만 본다. 목소리 목록을 받아오는 호출은
              # 글자를 합성하지 않으므로 돈이 들지 않는다.
              echo "Google TTS에 목소리 목록을 물어봅니다. 합성하지 않으므로 비용 0원입니다."
              node src/main.mjs voice --voices
              echo "키가 살아 있습니다. 이제 '완성본' 모드를 돌릴 수 있습니다."
              ;;
            *'완성본'*)
              args+=("--scripts=$IN_SCRIPTS" "--minutes=$IN_MINUTES" "--scenes" "--images" "--narrate" "--video")
              args+=("--image-model=$IN_IMAGE_MODEL" "--max-usd=$IN_MAX_USD")
              if [ -n "$RESUME_ID" ]; then
                args+=("--resume=$RESUME_ID")
                echo "이어하기: content/$RESUME_ID. 이미 만들어 둔 것은 다시 사지 않습니다."
              else
                echo "소재 → 대본 → 장면 → 그림 → 목소리·배경음악 → 영상·쇼츠."
                echo "자막과 장면 전환이 실제 음성 길이에 맞춰집니다. 40~60분 걸립니다."
              fi
              node src/main.mjs auto "${args[@]}"
              # 영상까지 다 만들었으면 올릴 거리도 함께 만든다. 썸네일은
              # 방금 만든 영상에서 떼어내므로 여기서 해야 맞다.
              #
              # 실패해도 실행을 죽이지 않는다. 영상은 이미 돈을 주고 만들었고,
              # 올릴 거리는 upload 모드로 따로 다시 만들 수 있다.
              up_id="$(pick_id)"
              if [ -n "$up_id" ]; then
                node src/main.mjs upload --id="$up_id" \
                  || echo "::warning::올릴 거리 만들기에 실패했습니다. 영상은 그대로 있습니다. '올릴 거리만 만들기' 모드로 다시 만들 수 있습니다."
              fi
              ;;
            *'그림'*)
              args+=("--scripts=$IN_SCRIPTS" "--minutes=$IN_MINUTES" "--scenes" "--images" "--video")
              args+=("--image-model=$IN_IMAGE_MODEL" "--max-usd=$IN_MAX_USD")
              echo "소재 → 대본 → 장면 → 진짜 그림 → 영상·쇼츠까지 만듭니다."
              echo "이미지 모델 $IN_IMAGE_MODEL, 돈 상한 \$$IN_MAX_USD. 30~50분 걸립니다."
              node src/main.mjs auto "${args[@]}"
              ;;
            *'영상'*)
              args+=("--scripts=$IN_SCRIPTS" "--minutes=$IN_MINUTES" "--scenes" "--video")
              echo "소재 → 대본 → 장면 → 영상·쇼츠까지 만듭니다. AI 영상 비중 $IN_VIDEO_RATIO"
              echo "렌더링은 AI를 안 쓰므로 추가 비용이 없습니다. 시간은 10~20분 걸립니다."
              node src/main.mjs auto "${args[@]}"
              ;;
            *'장면까지'*)
              args+=("--scripts=$IN_SCRIPTS" "--minutes=$IN_MINUTES" "--scenes")
              echo "소재 → 대본 → 장면·프롬프트까지 만듭니다. AI 영상 비중 $IN_VIDEO_RATIO"
              node src/main.mjs auto "${args[@]}"
              ;;
            *'대본까지'*)
              args+=("--scripts=$IN_SCRIPTS" "--minutes=$IN_MINUTES")
              echo "소재를 찾고, 관문을 통과한 것 중 $IN_SCRIPTS편의 대본을 씁니다."
              node src/main.mjs auto "${args[@]}"
              ;;
            *)
              echo "소재만 찾습니다. 대본은 쓰지 않습니다."
              node src/main.mjs collect "${args[@]}"
              ;;
          esac

      # 대본을 실행 기록에 그대로 찍는다.
      #
      # Artifacts zip을 내려받아 압축을 풀어야 대본을 읽을 수 있었다. 대본을
      # 읽는 게 이 단계의 유일한 목적인데 그 과정이 번거로웠다. 실행 화면을
      # 펼치면 바로 보이게 한다.
      #
      # 실패해도 계속 간다. 파일은 Artifacts에 그대로 올라가므로 찍기에
      # 실패한 것이 결과물을 잃는 것은 아니다.
      - name: 만들어진 대본 보여주기
        if: ${{ always() && !contains(inputs.mode, '테스트만') && !contains(inputs.mode, '소리 점검') }}
        continue-on-error: true
        working-directory: ai-surprise
        run: |
          shopt -s nullglob
          found=0
          for f in content/*/script.md; do
            found=1
            id="${f%/script.md}"; id="${id#content/}"
            echo "::group::📄 대본 content/$id/script.md"
            cat "$f"
            echo "::endgroup::"
          done
          for f in content/*/script-check.json; do
            id="${f%/script-check.json}"; id="${id#content/}"
            echo "::group::🔎 대본 검사 결과 content/$id"
            cat "$f"
            echo "::endgroup::"
          done
          for f in content/*/scenes.json; do
            id="${f%/scenes.json}"; id="${id#content/}"
            echo "::group::🎬 장면 content/$id/scenes.json"
            cat "$f"
            echo "::endgroup::"
          done
          for f in content/*/upload/올릴때-쓸것.md; do
            id="${f%/upload/올릴때-쓸것.md}"; id="${id#content/}"
            echo "::group::📤 올릴 때 쓸 것 content/$id"
            cat "$f"
            echo "::endgroup::"
          done
          for f in content/*/video/shorts.json; do
            id="${f%/video/shorts.json}"; id="${id#content/}"
            echo "::group::📱 쇼츠 후보 content/$id"
            cat "$f"
            echo "::endgroup::"
          done
          for f in content/*/assets; do
            id="${f%/assets}"; id="${id#content/}"
            echo "만들어진 그림 content/$id: $(ls "$f" 2>/dev/null | grep -c '\.png$') 장"
          done
          echo "만들어진 영상 파일:"
          ls -lh content/*/video/final.mp4 content/*/video/shorts/*.mp4 2>/dev/null || echo "  (없음)"
          [ "$found" = "1" ] || echo "만들어진 대본이 없습니다."

      - name: 결과물 올리기 (소재 목록·대본)
        if: ${{ always() && !contains(inputs.mode, '테스트만') && !contains(inputs.mode, '소리 점검') }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-surprise-${{ github.run_number }}
          path: |
            ai-surprise/inbox/
            ai-surprise/content/
            ai-surprise/logs/
            ai-surprise/preview/
            !ai-surprise/content/*/video/clips/
            !ai-surprise/content/*/video/silent.mp4
          if-no-files-found: ignore
          retention-days: 30
