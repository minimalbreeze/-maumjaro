name: AI 서프라이즈 소재·대본·영상 만들기

# 왜 여기서 도는가
#   PC에 Node를 깔거나 터미널을 열 필요 없이 GitHub 화면에서 버튼만 누르면
#   된다. sports-news.yml 과 같은 방식이다.
#
# 안전장치
#   - 기본값은 "테스트만"이다. 실수로 눌러도 돈이 들지 않는다.
#   - 유튜브에 아무것도 올리지 않는다. Phase 1에는 업로드 코드가 아예 없다.
#   - 1차 기록이 확인되고 출처가 2개 이상인 소재만 대본을 쓴다.
#     검토가 필요한 소재는 목록으로만 남고 대본을 쓰지 않는다.
#   - 자동 실행(cron)을 걸지 않았다. 사람이 누를 때만 돈다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '무엇을 할까요'
        required: true
        default: '테스트만 (비용 0원 · 처음엔 이걸로)'
        type: choice
        options:
          - '테스트만 (비용 0원 · 처음엔 이걸로)'
          - '소재만 찾기 (대본 안 씀)'
          - '소재 찾고 대본까지 쓰기'
          - '소재 → 대본 → 장면까지 쓰기'
          - '소재 → 대본 → 장면 → 영상·쇼츠까지 만들기'
      video_ratio:
        description: 'AI 영상 비중 (0.15 = 샷의 15%만 영상. 올리면 비싸집니다)'
        required: false
        default: '0.15'
      count:
        description: '찾을 소재 수'
        required: false
        default: '5'
      scripts:
        description: '쓸 대본 수 (점수 높은 순. 대본까지 쓰기에서만 씁니다)'
        required: false
        default: '1'
      minutes:
        description: '영상 길이 (분)'
        required: false
        default: '4'
      category:
        description: '분야 (비우면 알아서 섞습니다). 예: 과학적 미스터리'
        required: false
        default: ''

# 리포에 아무것도 쓰지 않는다. 읽기 권한이면 충분하다.
permissions:
  contents: read

concurrency:
  group: ai-surprise
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-surprise/package-lock.json

      - name: 설치
        working-directory: ai-surprise
        run: npm ci

      # 자체 검사는 어느 방식이든 먼저 돈다. 몇 초면 끝나고 돈이 안 든다.
      # 코드가 깨진 상태로 AI를 부르면 돈만 쓰고 결과가 안 나온다.
      - name: 자체 검사
        working-directory: ai-surprise
        run: npm test

      - name: 비밀값이 등록되어 있는지 확인
        if: ${{ !contains(inputs.mode, '테스트만') }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY 가 등록되지 않았습니다."
            echo "리포 Settings → Secrets and variables → Actions → New repository secret 에서 추가하세요."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY 등록되어 있습니다. (값은 출력하지 않습니다)"

      # 영상을 만들 때만 깐다. 다른 방식에서는 1분 넘게 기다릴 이유가 없다.
      # fonts-noto-cjk 가 없으면 자막의 한글이 전부 네모로 나온다 —
      # 그런데 ffmpeg는 오류를 내지 않으므로, 영상을 눈으로 보기 전까지
      # 모른다. 그래서 깐 다음 실제로 글자가 그려지는지 확인한다.
      - name: ffmpeg와 한글 글꼴 설치
        if: ${{ contains(inputs.mode, '영상') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -hide_banner -version | head -1
          fc-list | grep -ci "noto sans cjk" || {
            echo "::error::한글 글꼴이 설치되지 않았습니다. 자막이 네모로 나옵니다."
            exit 1
          }

      - name: 실행
        if: ${{ !contains(inputs.mode, '테스트만') }}
        working-directory: ai-surprise
        env:
          # 입력값을 명령줄에 직접 끼워 넣지 않는다.
          # GitHub 표현식을 run 블록에 바로 쓰면 입력에 들어간 셸 문자가
          # 그대로 실행되므로, env로 넘겨받아 배열로 조립한다.
          IN_MODE: ${{ inputs.mode }}
          IN_COUNT: ${{ inputs.count }}
          IN_SCRIPTS: ${{ inputs.scripts }}
          IN_MINUTES: ${{ inputs.minutes }}
          IN_CATEGORY: ${{ inputs.category }}
          IN_VIDEO_RATIO: ${{ inputs.video_ratio }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 장면 단계가 읽는다. 샷 중 몇 %를 AI 영상으로 만들지 정한다.
          VIDEO_SHOT_RATIO: ${{ inputs.video_ratio }}
        run: |
          for pair in "소재 수:$IN_COUNT" "대본 수:$IN_SCRIPTS" "영상 길이:$IN_MINUTES"; do
            label="${pair%%:*}"; value="${pair#*:}"
            case "$value" in
              ''|*[!0-9]*) echo "::error::${label}는 숫자여야 합니다: $value"; exit 1 ;;
            esac
          done
          case "$IN_VIDEO_RATIO" in
            ''|*[!0-9.]*|*.*.*) echo "::error::영상 비중은 0~1 사이 숫자여야 합니다: $IN_VIDEO_RATIO"; exit 1 ;;
          esac

          args=("--count=$IN_COUNT")
          [ -n "$IN_CATEGORY" ] && args+=("--category=$IN_CATEGORY")

          case "$IN_MODE" in
            *'영상'*)
              args+=("--scripts=$IN_SCRIPTS" "--minutes=$IN_MINUTES" "--scenes" "--video")
              echo "소재 → 대본 → 장면 → 영상·쇼츠까지 만듭니다. AI 영상 비중 $IN_VIDEO_RATIO"
              echo "렌더링은 AI를 안 쓰므로 추가 비용이 없습니다. 시간은 10~20분 걸립니다."
              node src/main.mjs auto "${args[@]}"
              ;;
            *'장면까지'*)
              args+=("--scripts=$IN_SCRIPTS" "--minutes=$IN_MINUTES" "--scenes")
              echo "소재 → 대본 → 장면·프롬프트까지 만듭니다. AI 영상 비중 $IN_VIDEO_RATIO"
              node src/main.mjs auto "${args[@]}"
              ;;
            *'대본까지'*)
              args+=("--scripts=$IN_SCRIPTS" "--minutes=$IN_MINUTES")
              echo "소재를 찾고, 관문을 통과한 것 중 $IN_SCRIPTS편의 대본을 씁니다."
              node src/main.mjs auto "${args[@]}"
              ;;
            *)
              echo "소재만 찾습니다. 대본은 쓰지 않습니다."
              node src/main.mjs collect "${args[@]}"
              ;;
          esac

      # 대본을 실행 기록에 그대로 찍는다.
      #
      # Artifacts zip을 내려받아 압축을 풀어야 대본을 읽을 수 있었다. 대본을
      # 읽는 게 이 단계의 유일한 목적인데 그 과정이 번거로웠다. 실행 화면을
      # 펼치면 바로 보이게 한다.
      #
      # 실패해도 계속 간다. 파일은 Artifacts에 그대로 올라가므로 찍기에
      # 실패한 것이 결과물을 잃는 것은 아니다.
      - name: 만들어진 대본 보여주기
        if: ${{ always() && !contains(inputs.mode, '테스트만') }}
        continue-on-error: true
        working-directory: ai-surprise
        run: |
          shopt -s nullglob
          found=0
          for f in content/*/script.md; do
            found=1
            id="${f%/script.md}"; id="${id#content/}"
            echo "::group::📄 대본 content/$id/script.md"
            cat "$f"
            echo "::endgroup::"
          done
          for f in content/*/script-check.json; do
            id="${f%/script-check.json}"; id="${id#content/}"
            echo "::group::🔎 대본 검사 결과 content/$id"
            cat "$f"
            echo "::endgroup::"
          done
          for f in content/*/scenes.json; do
            id="${f%/scenes.json}"; id="${id#content/}"
            echo "::group::🎬 장면 content/$id/scenes.json"
            cat "$f"
            echo "::endgroup::"
          done
          for f in content/*/video/shorts.json; do
            id="${f%/video/shorts.json}"; id="${id#content/}"
            echo "::group::📱 쇼츠 후보 content/$id"
            cat "$f"
            echo "::endgroup::"
          done
          echo "만들어진 영상 파일:"
          ls -lh content/*/video/final.mp4 content/*/video/shorts/*.mp4 2>/dev/null || echo "  (없음)"
          [ "$found" = "1" ] || echo "만들어진 대본이 없습니다."

      - name: 결과물 올리기 (소재 목록·대본)
        if: ${{ always() && !contains(inputs.mode, '테스트만') }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-surprise-${{ github.run_number }}
          path: |
            ai-surprise/inbox/
            ai-surprise/content/
            ai-surprise/logs/
            !ai-surprise/content/*/video/clips/
            !ai-surprise/content/*/video/silent.mp4
          if-no-files-found: ignore
          retention-days: 30
