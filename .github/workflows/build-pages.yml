name: 검색용 페이지 생성

# 왜 CI에서 도는가
#   맘운자로는 빌드 도구가 없는 정적 사이트다. 그런데 검색용 페이지 63장을 손으로
#   관리하면 데이터(mbti-data.js 등)와 반드시 어긋난다.
#   데이터가 바뀌면 여기서 다시 생성해 커밋한다 — 페이지는 항상 데이터의 결과물이다.

on:
  push:
    branches: [main]
    paths:
      # 페이지 내용의 출처가 되는 파일이 바뀔 때만 돈다
      - 'mbti-data.js'
      - 'tarot-data.js'
      - 'zodiac-data.js'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/build-pages.yml'
  workflow_dispatch:

# 생성한 페이지를 리포에 커밋해야 하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 페이지 생성
        run: node scripts/build-pages.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mbti tarot zodiac animal guide sitemap.xml scripts/.pages-manifest.json
          # 안전장치: 이 워크플로는 페이지를 "추가"하는 일만 한다.
          # 삭제가 잡히면(예: tarot/ 안의 카드 이미지) 뭔가 잘못된 것이므로 멈춘다.
          # 실제로 한 번 tarot/*.jpg 22장을 통째로 날린 적이 있다.
          DELETED=$(git diff --staged --diff-filter=D --name-only | grep -v '/index\.html$' || true)
          if [ -n "$DELETED" ]; then
            echo "::error::생성 스크립트가 페이지가 아닌 파일을 지웠습니다:"
            echo "$DELETED"
            exit 1
          fi
          # 생성 결과가 이전과 같으면 커밋할 것이 없다(빈 커밋을 만들지 않는다).
          if git diff --staged --quiet; then
            echo "바뀐 페이지 없음"
          else
            git commit -m "검색용 페이지 자동 생성 (데이터 변경 반영)"
            git push
          fi
