name: 스레드 자동 홍보

on:
  # ⏸️ 예약 게시를 멈춰 뒀다 (2026-10-15)
  #
  # 왜
  #   페이드캠 출시 홍보 기간이라 스레드 계정을 페이드캠에 비워 준다.
  #   페이드캠이 월·수·금 저녁 6시에 올라가는데(fadecam-post.yml), 맘운자로가
  #   같은 시각에 매일 올라가면 월·수·금은 하루에 두 글이 나간다. 성격이 다른
  #   두 글이 같은 시간에 나가면 둘 다 묻힌다.
  #
  # 다시 켜려면
  #   아래 네 줄의 주석(#)만 떼면 된다. 다른 건 그대로 둬도 동작한다.
  #
  # 지금도 Actions 탭에서 손으로는 올릴 수 있다(workflow_dispatch).
  #
  # 09:00 UTC = 한국시간 오후 6시. 아침이 아니라 저녁인 이유: 스레드는 올린 뒤
  # 첫 1시간의 답글이 도달을 크게 가르는데, 그 시간에 사람이 깨어 있어야 답글이
  # 붙는다. 예약 실행은 혼잡할 때 5~15분 늦게 도는 경우가 있다(정상 동작).
  #
  # schedule:
  #   - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '실제로 올리지 않고 글만 확인하기'
        type: boolean
        default: true

# 스레드에 글을 쓰는 일이라 리포 자체에는 아무 권한도 필요 없다.
permissions:
  contents: read

concurrency:
  # 예약 실행과 수동 실행이 겹쳐 같은 글이 두 번 올라가는 것을 막는다.
  group: threads-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 오늘의 스레드 게시
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          # 예약 실행일 때 inputs.dry_run은 비어 있으므로 실제 게시가 된다.
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/threads-post.mjs
