<svg xmlns="http://www.w3.org/2000/svg" width="620" height="96" viewBox="0 0 620 96">
  <!-- 쓸 크기(가로 약 560px)에 맞춰 그린다.
       전에 520px 로 그려 360px 로 줄였더니 선이 1.45px, 글자가 19px 이 되어
       화면에서 사라졌다(밝은 픽셀 1개). 줄이지 않고 쓴다. -->
