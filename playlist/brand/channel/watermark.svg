<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <!-- 플레이어 구석에 40px 쯤으로 뜬다. 가로선이 긴 원본 로고를 그대로 넣으면
       원이 콩알만 해지므로, 선을 짧은 토막으로 줄여 원을 키웠다.
       밝은 화면 위에서도 보이게 어두운 테두리를 한 겹 깐다. -->
  <g transform="translate(75,75)">
    <!-- 어두운 테두리 (밝은 영상 위 대비) -->
    <g fill="none" stroke="#000000" stroke-opacity="0.45" stroke-width="10">
      <circle r="42"/>
      <line x1="-62" y1="0" x2="-50" y2="0" stroke-linecap="round"/>
      <line x1="50" y1="0" x2="62" y2="0" stroke-linecap="round"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="6">
      <circle r="42"/>
      <line x1="-62" y1="0" x2="-50" y2="0" stroke-linecap="round"/>
      <line x1="50" y1="0" x2="62" y2="0" stroke-linecap="round"/>
    </g>
    <circle r="7.5" fill="#ffffff" stroke="#000000" stroke-opacity="0.45" stroke-width="2.5"/>
  </g>
</svg>
