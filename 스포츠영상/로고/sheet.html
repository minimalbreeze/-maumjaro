<!doctype html><meta charset="utf-8">
<style>
body{margin:0;background:#8a8a8a;font:13px/1.5 -apple-system,"Noto Sans CJK KR",sans-serif;color:#111;padding:14px}
h3{margin:16px 0 6px;font-size:14px}
.full{position:relative;width:556px}
.full img{width:100%;display:block}
.safe{position:absolute;left:12.26%;top:31.64%;width:75.49%;height:36.72%;
      outline:2px dashed #ff9166;pointer-events:none}
.safe b{position:absolute;top:-20px;left:0;color:#ff9166;font-size:11px;white-space:nowrap}
.crop{width:420px;height:115px;overflow:hidden;position:relative;border-radius:3px}
.crop img{position:absolute;width:556px;left:-68px;top:-99px}
.cap{font-size:11px;opacity:.85;margin-top:4px}
.row{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
</style><div id="r"></div><script>
r.innerHTML=['A','B','C'].map(k=>`
<h3>${k}안</h3><div class="row">
 <div><div class="full"><img src="banner-${k}.png"><div class="safe"><b>휴대폰에서 보이는 영역</b></div></div>
  <div class="cap">전체 2048×1152 — TV에서만 다 보인다</div></div>
 <div><div class="crop"><img src="banner-${k}.png"></div>
  <div class="cap">↑ 휴대폰에서 실제로 보이는 것</div></div>
</div>`).join('');
</script>
