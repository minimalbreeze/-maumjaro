<script>
(function(){
  var bar = document.getElementById('cpst');
  var inner = document.getElementById('cpst-in');
  var x = document.getElementById('cpst-x');
  if (!bar || !inner || !x) return;
  var KEY = 'cpst-folded';

  // ── 왜 '접기' 인가 (2026-11-14, 네 번째 손질) ────────────────────────
  //
  // 닫기 버튼을 세 번 고쳤고 세 번 다 틀렸다. 운영자: **"아직도 하단 쿠팡
  // 광고 닫기 버튼이 없다. 안 되면 닫기 말고 접기로 하던지."**
  //
  // 틀린 이유는 매번 같았다 — 버튼을 바 **위에 띄워** 놓고 z-index 와 자리를
  // 계산했기 때문이다. 띄우면 계산이 틀리거나 다른 레이어에 덮인다.
  //
  //   1차: 버튼 아래 절반이 캐러셀에 덮여 누르면 광고가 열렸다
  //   2차: z-index 를 올렸지만 #cpst 가 쌓임 문맥이라 9999 로 묶였다
  //   3차: body 직속 fixed 로 옮겼더니 **화면 밖으로 갔다**
  //
  // 그래서 **띄우지 않는다.** 바 안 맨 위에 전체 너비 띠로 박는다.
  //   · 흐름대로 배치되므로 화면 밖으로 갈 수가 없다 (자리 계산이 없다)
  //   · 광고보다 **위에** 있으므로 덮일 수가 없다 (z-index 가 필요 없다)
  //   · 전체 너비라 손가락으로 빗나갈 일이 없다
  //
  // 닫기가 아니라 접기다. 접으면 광고만 숨고 띠는 남아, 다시 펼 수 있다.
  var 접힘 = false;
  try { 접힘 = !!sessionStorage.getItem(KEY); } catch (e) {}

  function 그리기() {
    inner.style.display = 접힘 ? 'none' : '';
    x.textContent = 접힘 ? '광고 펼치기 ▴' : '광고 접기 ▾';
    x.setAttribute('aria-expanded', 접힘 ? 'false' : 'true');
    여백();
  }
  function 접기토글(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    접힘 = !접힘;
    try {
      if (접힘) sessionStorage.setItem(KEY, '1');
      else sessionStorage.removeItem(KEY);
    } catch (e2) {}
    그리기();
  }
  x.addEventListener('click', 접기토글);

  // ── 콘텐츠 보호 플러그인이 클릭을 가로챈다 ───────────────────────────
  //
  // 운영자 캡처에 **"ALERT: Content is protected !!"** 가 떴다. 복사·우클릭
  // 방지 플러그인이 document 에서 클릭을 잡아 막아, 버튼까지 이벤트가
  // 도달하지 않는다. 그래서 **캡처 단계**에서 먼저 받는다 — 캡처는
  // document 에서 대상으로 내려가는 단계라 버블에서 막는 쪽보다 앞선다.
  //
  // ⚠️ 누를 때가 아니라 **뗄 때** 접는다. pointerdown 에서 접으면 버튼이
  //    움직여 뒤이은 click 이 아래 광고로 떨어진다(실수 클릭).
  function 버튼위인가(t) {
    for (; t; t = t.parentNode) if (t === x) return true;
    return false;
  }
  function 가로채기(e) {
    if (!버튼위인가(e.target)) return;
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();
    e.preventDefault();
    접기토글();
  }
  try {
    document.addEventListener('click', 가로채기, true);
    document.addEventListener('pointerup', 가로채기, true);
    document.addEventListener('touchend', 가로채기, true);
  } catch (e) {}

  // 바가 글 마지막 줄을 덮지 않게 아래 여백을 준다. 캐러셀이 늦게 그려지므로
  // 높이를 한 번 더 잰다. 버튼이 바 안에 있으므로 따로 더할 높이가 없다.
  var 숨김 = false;
  function 여백() {
    document.body.style.paddingBottom = 숨김 ? '' : (bar.offsetHeight + 12) + 'px';
  }
  그리기();
  setTimeout(여백, 1500);
  window.addEventListener('resize', 여백);

  // ── 구글 광고를 덮지 않는다 ──────────────────────────────────────────
  //
  // 애드센스는 광고가 다른 요소에 가려지는 것을 허용하지 않는다. 자동 광고의
  // 앵커 광고도 bottom:0 이라 같은 자리에서 겹친다. fixed 요소는 z-index 를
  // 낮춰도 본문 광고 위에 그려지므로(쌓임 문맥이 다르다) 겹치면 **우리 바를
  // 숨긴다.** 숨기는 쪽이 우리 바다 — 애드센스가 정책으로 묶인 쪽이고
  // 수익도 크다.
  //
  // ⚠️ 재는 데 실패하면 지금까지의 동작(바가 보임)을 그대로 둔다.
  function 구글광고들() {
    var 것들 = [];
    try {
      var ins = document.querySelectorAll('ins.adsbygoogle');
      for (var i = 0; i < ins.length; i++) 것들.push(ins[i]);
      var ifr = document.querySelectorAll('iframe');
      for (var j = 0; j < ifr.length; j++) {
        var src = ifr[j].src || '';
        if (src.indexOf('googlesyndication') >= 0 || src.indexOf('doubleclick') >= 0
            || src.indexOf('googleads') >= 0) 것들.push(ifr[j]);
      }
    } catch (e) {}
    return 것들;
  }
  function 겹침확인() {
    try {
      var r = bar.getBoundingClientRect();
      if (!r.height) return;
      var 겹친다 = false;
      var 광고 = 구글광고들();
      for (var i = 0; i < 광고.length; i++) {
        var a = 광고[i].getBoundingClientRect();
        if (!a.width || !a.height) continue;
        if (a.bottom > r.top && a.top < r.bottom && a.right > r.left && a.left < r.right) {
          겹친다 = true;
          break;
        }
      }
      if (겹친다 !== 숨김) {
        숨김 = 겹친다;
        // visibility 를 쓴다 — display 를 건드리면 캐러셀이 다시 그려진다.
        bar.style.visibility = 겹친다 ? 'hidden' : '';
        여백();
      }
    } catch (e) {}
  }
  var 대기 = false;
  function 예약() {
    if (대기) return;
    대기 = true;
    requestAnimationFrame(function () { 대기 = false; 겹침확인(); });
  }
  window.addEventListener('scroll', 예약, { passive: true });
  window.addEventListener('resize', 예약);
  // 광고는 늦게 그려진다. 처음 몇 초만 몇 번 더 본다.
  setTimeout(겹침확인, 1200);
  setTimeout(겹침확인, 3000);
  겹침확인();
})();
</script>
