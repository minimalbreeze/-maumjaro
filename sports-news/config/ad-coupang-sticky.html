<div id="cpst" style="position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#fff;border-top:1px solid #e5e7eb;padding:6px 10px 8px;box-shadow:0 -2px 10px rgba(0,0,0,.08)">
<button id="cpst-x" type="button" aria-label="닫기" style="position:absolute;top:-13px;right:10px;width:26px;height:26px;border-radius:13px;border:1px solid #e5e7eb;background:#fff;color:#555;font-size:15px;line-height:1;cursor:pointer">×</button>
<div style="font-size:11px;color:#777;margin:0 0 4px">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다</div>
<iframe src="https://coupa.ng/ciwQYr" width="100%" height="44" frameborder="0" scrolling="no" referrerpolicy="unsafe-url" browsingtopics></iframe>
</div>
<script>
(function(){
  var bar = document.getElementById('cpst');
  if (!bar) return;
  var KEY = 'cpst-closed';
  // 닫으면 그 방문 동안 다시 뜨지 않는다. sessionStorage 가 막혀 있어도(사생활
  // 보호 모드 등) 바는 그대로 뜬다 — 광고가 사라지는 쪽보다 낫다.
  try { if (sessionStorage.getItem(KEY)) { bar.style.display = 'none'; return; } } catch (e) {}
  var x = document.getElementById('cpst-x');
  if (x) x.addEventListener('click', function () {
    bar.style.display = 'none';
    document.body.style.paddingBottom = '';
    try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
  });
  // 바가 글 마지막 줄을 덮지 않게 아래 여백을 준다.
  document.body.style.paddingBottom = (bar.offsetHeight + 12) + 'px';
})();
</script>
