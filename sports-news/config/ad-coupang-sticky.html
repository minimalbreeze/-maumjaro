<button id="cpst-x" type="button" aria-label="닫기" style="position:absolute;top:-40px;right:8px;width:36px;height:36px;border-radius:18px;border:1px solid #e5e7eb;background:#fff;color:#555;font-size:19px;line-height:1;cursor:pointer;z-index:2147483647;pointer-events:auto;touch-action:manipulation;box-shadow:0 1px 4px rgba(0,0,0,.18);padding:0">×</button>

<script>
(function(){
  var bar = document.getElementById('cpst');
  if (!bar) return;
  var KEY = 'cpst-closed';
  // 닫으면 그 방문 동안 다시 뜨지 않는다. sessionStorage 가 막혀 있어도(사생활
  // 보호 모드 등) 바는 그대로 뜬다 — 광고가 사라지는 쪽보다 낫다.
  try { if (sessionStorage.getItem(KEY)) { bar.style.display = 'none'; return; } } catch (e) {}
  // 겹쳐서 숨긴 상태인가. 여백() 이 이 값을 보므로 먼저 선언한다.
  var 숨김 = false;
  // 닫기 버튼이 바 위로 솟아 있는 높이. 여백과 겹침 검사가 함께 쓴다.
  var 솟은높이 = 44;
  var x = document.getElementById('cpst-x');
  // **click 하나만 받는다.** (2026-11-10, 두 번째 손질)
  //
  // 한때 pointerdown 도 함께 받았다. 버튼 아래 절반이 쿠팡 캐러셀에 덮여 있던
  // 시절, 위젯이 클릭을 가로채도 먼저 들어오라고 넣은 보조 장치였다.
  //
  // ⚠️ 그런데 pointerdown 에서 바를 숨기면 **버튼이 그 자리에서 사라진다.**
  //    뒤이어 오는 click 은 그 지점에 새로 온 것 위로 떨어진다 — 클릭이 아래로
  //    새는 것이다. 처음에 고쳤던 버그와 **같은 종류**이고, 그 아래가 광고였다면
  //    다시 실수 클릭이 된다.
  //
  // 지금은 버튼이 광고 영역 바깥에 있어 가로채일 일이 없다. 보조 장치를 둘
  // 이유가 사라졌으므로 **클릭이 끝난 뒤에 숨기는 쪽**으로 되돌린다.
  // click 은 버튼 위에서 눌렀다 뗐을 때만 오고, 그때 대상은 이미 정해져 있다.
  if (x) x.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    bar.style.display = 'none';
    document.body.style.paddingBottom = '';
    try { sessionStorage.setItem(KEY, '1'); } catch (e2) {}
  });
  // 바가 글 마지막 줄을 덮지 않게 아래 여백을 준다. 캐러셀이 늦게 그려지므로
  // 높이를 한 번 더 잰다 — 처음 잰 값만 쓰면 여백이 모자란다.
  // ⚠️ 숨어 있을 때는 여백을 주지 않는다. resize 때 여백() 이 먼저 돌고
  //    겹침확인() 은 "상태가 그대로면" 아무것도 안 하므로, 이 줄이 없으면
  //    **숨은 채로 아래 여백만 남는다** — 글 끝에 빈 칸이 생긴다.
  function 여백() {
    if (숨김) { document.body.style.paddingBottom = ''; return; }
    document.body.style.paddingBottom = (bar.offsetHeight + 솟은높이 + 12) + 'px';
  }
  여백();
  setTimeout(여백, 1500);
  window.addEventListener('resize', 여백);

  // ── 구글 광고를 덮지 않는다 (2026-11-09) ──────────────────────────
  //
  // 이 바는 position:fixed; bottom:0; z-index:9999 다. 위의 여백은 **글
  // 마지막 줄**만 지킨다 — 스크롤 중에 본문 광고가 바 뒤로 지나가면 덮인다.
  // 애드센스는 광고가 다른 요소에 가려지는 것을 허용하지 않는다. 자동 광고의
  // 앵커 광고가 켜져 있으면 그것도 bottom:0 이라 같은 자리에서 겹친다.
  //
  // fixed 요소는 z-index 를 낮춰도 본문 광고 위에 그려진다(쌓임 문맥이
  // 달라서다). 그래서 z-index 를 만지는 것으로는 안 풀린다. 겹치는지
  // 재서 겹치면 **우리 바를 숨긴다.**
  //
  // 숨기는 쪽이 우리 바다. 애드센스가 정책으로 묶인 쪽이고 수익도 크다.
  // 쿠팡 바는 겹치지 않는 자리에서 다시 보인다.
  //
  // ⚠️ 재는 데 실패하면 **지금까지의 동작(바가 보임)을 그대로 둔다.**
  //    코드 한 줄이 틀렸을 때 모든 글에서 쿠팡 광고가 사라지는 쪽이 더 나쁘다.
  function 구글광고들() {
    var 것들 = [];
    try {
      var ins = document.querySelectorAll('ins.adsbygoogle');
      for (var i = 0; i < ins.length; i++) 것들.push(ins[i]);
      // 앵커 광고는 body 에 붙는 iframe 으로 그려진다.
      var ifr = document.querySelectorAll('iframe');
      for (var j = 0; j < ifr.length; j++) {
        var src = ifr[j].src || '';
        if (src.indexOf('googlesyndication') >= 0 || src.indexOf('doubleclick') >= 0
            || src.indexOf('googleads') >= 0) 것들.push(ifr[j]);
      }
    } catch (e) {}
    return 것들;
  }
  function 겹침확인() {
    try {
      if (bar.style.display === 'none') return;
      var r = bar.getBoundingClientRect();
      if (!r.height) return;
      // 닫기 버튼이 솟은 자리까지 포함해서 잰다 — 버튼이 광고를 덮어도 안 된다.
      var b = { top: r.top - 솟은높이, bottom: r.bottom, left: r.left, right: r.right };
      var 겹친다 = false;
      var 광고 = 구글광고들();
      for (var i = 0; i < 광고.length; i++) {
        var a = 광고[i].getBoundingClientRect();
        if (!a.width || !a.height) continue;
        if (a.bottom > b.top && a.top < b.bottom && a.right > b.left && a.left < b.right) {
          겹친다 = true;
          break;
        }
      }
      if (겹친다 !== 숨김) {
        숨김 = 겹친다;
        // visibility 를 쓴다 — display 를 건드리면 캐러셀이 다시 그려진다.
        bar.style.visibility = 겹친다 ? 'hidden' : '';
        document.body.style.paddingBottom = 겹친다 ? '' : (bar.offsetHeight + 솟은높이 + 12) + 'px';
      }
    } catch (e) {}
  }
  var 대기 = false;
  function 예약() {
    if (대기) return;
    대기 = true;
    requestAnimationFrame(function () { 대기 = false; 겹침확인(); });
  }
  window.addEventListener('scroll', 예약, { passive: true });
  window.addEventListener('resize', 예약);
  // 광고는 늦게 그려진다. 처음 몇 초만 몇 번 더 본다.
  setTimeout(겹침확인, 1200);
  setTimeout(겹침확인, 3000);
  겹침확인();
})();
</script>
