  // stopPropagation 으로는 막히지 않는다. preventDefault 를 해야만 막히는데,
  // 보호 플러그인은 보통 contextmenu·selectstart·copy 에 그것을 걸지
  // click 에는 걸지 않는다.
  //
  // 아래 JS 는 **접기 자체를 하지 않는다.** 글자 바꾸기·여백·기억만 한다.
  // 전부 실패해도 접기는 그대로 동작한다.

  // 지난 방문에서 접었으면 접은 채로 연다.
  try { if (sessionStorage.getItem(KEY)) d.removeAttribute('open'); } catch (e) {}

  var 숨김 = false;
  function 여백() {

  }
  function 글자() {
    var 접힘 = !d.hasAttribute('open');
    x.textContent = 접힘 ? '광고 펼치기 ▴' : '광고 접기 ▾';

  d.addEventListener('toggle', function () {

  // 플러그인에게 가지 않게 한다.
  //
  // ⚠️ preventDefault 는 **하지 않는다.** 그것을 하면 click 이 생성되지
  //    않아 details 의 기본 동작까지 막힌다 — 고치려던 것을 내가 깨뜨린다.
  function 띠위인가(t) {

    return false;
  }

    if (!띠위인가(e.target)) return;
    e.stopPropagation();
    if (e.stopImmediatePropagation) e.stopImmediatePropagation();

  try {
    var 것들 = ['mousedown', 'pointerdown', 'touchstart', 'selectstart', 'contextmenu', 'dragstart'];
    for (var i = 0; i < 것들.length; i++) window.addEventListener(것들[i], 막기, true);
  } catch (e) {}

  // ── 구글 광고를 덮지 않는다 ──────────────────────────────────────────
  //
  // 애드센스는 광고가 가려지는 것을 허용하지 않는다. 겹치면 **우리 바를
  // 숨긴다** — 애드센스가 정책으로 묶인 쪽이고 수익도 크다.
  // 재는 데 실패하면 바가 보이는 쪽으로 둔다.
  function 구글광고들() {
    var 것들 = [];
    try {
      var ins = document.querySelectorAll('ins.adsbygoogle');
      for (var i = 0; i < ins.length; i++) 것들.push(ins[i]);
      var ifr = document.querySelectorAll('iframe');
      for (var j = 0; j < ifr.length; j++) {
        var src = ifr[j].src || '';
        if (src.indexOf('googlesyndication') >= 0 || src.indexOf('doubleclick') >= 0
            || src.indexOf('googleads') >= 0) 것들.push(ifr[j]);
      }
    } catch (e) {}
    return 것들;
  }
  function 겹침확인() {
    try {
      var r = bar.getBoundingClientRect();
      if (!r.height) return;
      var 겹친다 = false;
      var 광고 = 구글광고들();
      for (var i = 0; i < 광고.length; i++) {
        var a = 광고[i].getBoundingClientRect();
        if (!a.width || !a.height) continue;
        if (a.bottom > r.top && a.top < r.bottom && a.right > r.left && a.left < r.right) {
          겹친다 = true;

        bar.style.visibility = 겹친다 ? 'hidden' : '';

  }

    if (대기) return;
    대기 = true;
    requestAnimationFrame(function () { 대기 = false; 겹침확인(); });
  }
  window.addEventListener('scroll', 예약, { passive: true });
  window.addEventListener('resize', 예약);

  setTimeout(겹침확인, 3000);
  겹침확인();
})();
</script>
