<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9166"/><stop offset="100%" stop-color="#ffc66b"/>
    </linearGradient>
    <linearGradient id="mHood" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#8fd6c6"/><stop offset="100%" stop-color="#4fa392"/>
    </linearGradient>
    <linearGradient id="mSkin" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#fff1da"/><stop offset="100%" stop-color="#ffd9ab"/>
    </linearGradient>
    <linearGradient id="mLiq" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9166"/><stop offset="100%" stop-color="#ffc66b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#mBg)"/>

  <g transform="translate(109.75,94.05000000000001) scale(1.95)">
    <!-- 몸통 -->
    <path d="M75 78 c27 0 41 19 41 40 c0 17 -9 28 -41 28 s-41 -11 -41 -28 c0 -21 14 -40 41 -40 z"
          fill="url(#mHood)" stroke="#1f5c50" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="75" cy="124" rx="31" ry="22" fill="url(#mSkin)"/>
    <ellipse cx="64" cy="116" rx="10" ry="6" fill="rgba(255,255,255,0.45)"/>
    <ellipse cx="57" cy="147" rx="12" ry="7.5" fill="#3d8a7c" stroke="#1f5c50" stroke-width="4"/>
    <ellipse cx="93" cy="147" rx="12" ry="7.5" fill="#3d8a7c" stroke="#1f5c50" stroke-width="4"/>
    <!-- 후드 + 얼굴 -->
    <circle cx="75" cy="52" r="43" fill="url(#mHood)" stroke="#1f5c50" stroke-width="4"/>
    <ellipse cx="75" cy="58" rx="33.5" ry="31.5" fill="rgba(20,70,60,0.28)"/>
    <ellipse cx="75" cy="57" rx="31" ry="29" fill="url(#mSkin)" stroke="#1f5c50" stroke-width="3.6"/>
    <ellipse cx="63" cy="44" rx="12" ry="7.5" fill="rgba(255,255,255,0.5)"/>
    <path d="M58 60 q7 -9 14 0" fill="none" stroke="#1f5c50" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M78 60 q7 -9 14 0" fill="none" stroke="#1f5c50" stroke-width="3.6" stroke-linecap="round"/>
    <ellipse cx="52" cy="68" rx="7.5" ry="4.8" fill="#ffa8ae" opacity=".85"/>
    <ellipse cx="98" cy="68" rx="7.5" ry="4.8" fill="#ffa8ae" opacity=".85"/>
    <path d="M67 69 q8 8 16 0" fill="none" stroke="#1f5c50" stroke-width="3.2" stroke-linecap="round"/>
    <!-- 품에 안은 주사기. 하트 자리에 주사기를 둔다 — 브랜드 심볼은 이쪽이다.
         ⚠️ 처음에 작게 그렸더니 180px(iOS 홈 화면)에서 배 무늬처럼 뭉개졌다.
         아이콘에서 주사기가 안 보이면 CLAUDE.md의 "주사기를 주 모티프로" 조건을
         글자로만 지킨 셈이 된다. 그래서 몸통을 가로지르는 크기로 키우고,
         바늘이 실루엣 밖으로 나오게 해서 윤곽만 봐도 주사기로 읽히게 했다. -->
    <g transform="rotate(-26 75 122)">
      <!-- 바늘: 실루엣 밖으로 조금 나온다. 윤곽만 봐도 주사기로 읽히게 하는 건 이 선이다. -->
      <path d="M110 122 h16" stroke="#1f5c50" stroke-width="4" stroke-linecap="round"/>
      <!-- 약통 -->
      <rect x="54" y="110" width="54" height="25" rx="6" fill="#fffaf2" stroke="#1f5c50" stroke-width="4"/>
      <rect x="58" y="114" width="28" height="17" rx="3.5" fill="url(#mLiq)"/>
      <!-- 밀대 손잡이 -->
      <rect x="45" y="106" width="9" height="33" rx="3.5" fill="#fffaf2" stroke="#1f5c50" stroke-width="3.8"/>
    </g>
    <!-- 손은 주사기 위에 그린다 — 그래야 "들고 있다"가 된다. -->
    <circle cx="61" cy="129" r="8.5" fill="url(#mSkin)" stroke="#1f5c50" stroke-width="3.5"/>
    <circle cx="92" cy="117" r="8.5" fill="url(#mSkin)" stroke="#1f5c50" stroke-width="3.5"/>
  </g>
</svg>
